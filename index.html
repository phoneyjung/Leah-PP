window.DEFER_Q=[];window.DEFER_ON=true;window.DEFER_DONE=new Set();
(function(){try{const d=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');if(!d||!d.set)return;
  Object.defineProperty(HTMLImageElement.prototype,'src',{configurable:true,get(){return d.get.call(this)},set(v){try{const f=typeof v==='string'?v.split('/').pop().split('?')[0]:'';

  window.releaseDeferred=()=>{if(!window.DEFER_ON)return;window.DEFER_ON=false;const q=window.DEFER_Q.splice(0),O=window.DEFER_ORDER;q.sort((a,b)=>O.indexOf(a[2])-O.indexOf(b[2]));
    // one after another in order of how soon a player can reach them, so the nearest place is ready first
    let i=0;const next=()=>{if(i>=q.length)return;const [im,v]=q[i++];im.addEventListener('load',next,{once:true});im.addEventListener('error',next,{once:true});d.set.call(im,v)};next();next()};
  setTimeout(()=>window.releaseDeferred&&window.releaseDeferred(),30000)}catch(e){window.DEFER_ON=false}})();

const PETB={slime:{hpP:5},bat:{magnet:14},mushbug:{expP:5}},PET={x:0,y:0,row:0,t:0,find:45,heart:0};
function tryPet(kind){if(!PETB[kind]||Math.random()>.08)return;S.pets=S.pets||[];if(S.pets.some(p=>p.kind===kind))return;S.pets.push({kind,aff:10});if(S.pet==null||S.pet<0)S.pet=S.pets.length-1;PET.x=P.x;PET.y=P.y;sfx('wake');setTimeout(()=>{say('🐾 '+t('n_'+kind)+' '+t('petJoin'));msgT=5},900);save()}
const petNow=()=>S&&S.pets&&S.pet>=0?S.pets[S.pet]:null;
const petMul=()=>{const p=petNow();return p?1+p.aff/100:0};const petLv=()=>{const p=petNow();return p?Math.min(5,1+Math.floor(p.aff/20)):0};
function petBonus(k){const p=petNow();if(!p)return 0;if(k==='atkP')return petLv()>=3?5:0;if(k==='magnet'&&petLv()>=2)return(PETB[p.kind].magnet||0)*petMul()+10;return PETB[p.kind][k]?PETB[p.kind][k]*petMul():0}
function updPet(dt){const p=petNow();if(!p||!M)return;PET.t+=dt;PET.heart=Math.max(0,PET.heart-dt);const a=DIR_ANG[P.row]+2.2,gx=P.x-Math.cos(a)*26,gy=P.y-Math.sin(a)*16+4;const dx=gx-PET.x,dy=gy-PET.y,d=Math.hypot(dx,dy);
  if(Math.hypot(P.x-PET.x,P.y-PET.y)>170){PET.x=gx;PET.y=gy}else if(d>2){const sp=Math.min(1,d/20)*100*dt;PET.x+=dx/d*Math.min(sp,d);PET.y+=dy/d*Math.min(sp,d)}
  PET.find-=dt*(petLv()>=5?2:1);if(PET.find<=0){PET.find=45+Math.random()*30;if(petLv()>=4&&Math.random()<.3)DROPS.push({k:'gem',x:PET.x-6,y:PET.y});DROPS.push({k:'coin',n:1+Math.floor(Math.random()*3*petMul()),x:PET.x+6,y:PET.y});TXT.push({x:PET.x,y:PET.y-26,s:t('petFound'),c:'#ffe36b',t:0})}}

const FISH=[[0,5,9,null,3,4,'#bfe8ff'],[0,18,32,[6,18],5,5,'#8aa0b8'],[1,12,24,[5,11],9,8,'#ffd23f'],[1,30,60,[18,5],10,9,'#6b5a4a'],[0,3,6,null,3,4,'#e8f0f0'],[1,6,12,[16,20],8,8,'#a8683a'],
  [2,40,80,[17,20],20,16,'#3a4a5a'],[2,10,20,[12,17],18,15,'#e0c060'],[2,25,50,[20,4],22,18,'#8a7a9a'],[2,12,20,[6,10],25,20,'#6fae5a'],[3,15,30,'light',45,35,'#5fe0ff'],[4,60,120,[22,4],120,80,'#fff3c0']];
const FW=[[0,4],[1,5],[4,4],[2,2],[3,2],[5,2],[6,1],[7,1],[8,1],[9,.7],[10,.6],[11,.15]];const fwNow=()=>isRainy()?FW.map(([i,w])=>[i,[3,6,8].includes(i)?w*2.5:w]):FW;

function rollFish(){const h=new Date().getHours(),pool=fwNow().filter(([i])=>hourOk(h,FISH[i][3]));const tot=pool.reduce((a,[,w])=>a+w,0);let r=Math.random()*tot;for(const [i,w] of pool){if((r-=w)<=0)return i}return 0}

  else if(F.st==='wait'){F.st='idle';say(t('lost'))}}

  if(F.st==='wait'&&F.t<=0){F.st='bite';F.t=(isKid()?2:1.5)*(typeof fishBiteMul==='function'?fishBiteMul():1);sfx('warp');say('❗ '+t('bite'))}
  else if(F.st==='bite'&&F.t<=0){F.st='idle';say(t('lost'))}

    F.ft-=dt;if(F.ft<=0){F.ft=.35+Math.random()*(1.1-FISH[F.fish][0]*.15);F.ftg=4+Math.random()*H*.72}const want=(F.ftg??60)-F.fy;F.fv+=(Math.sign(want)*90*diff-F.fv*1.5)*dt;F.fy+=F.fv*dt;if(F.fy<4){F.fy=4;F.fv=Math.abs(F.fv)}if(F.fy>H-4){F.fy=H-4;F.fv=-Math.abs(F.fv)}

  const now=Date.now(),QR=S.qr||{};const due=QBANK.filter(q=>{const r=QR[q.id];return r&&r.box<3&&now>=r.due&&okQ(q)});
  if(due.length&&Math.random()<.4){const q=due[Math.floor(Math.random()*due.length)];q._review=1;lastQ=q.id;return q}

function sealPockets(m){const W=m.w,seen=new Set(),[sx,sy]=[Math.floor(m.spawnDefault[0]/T),Math.floor(m.spawnDefault[1]/T)],q=[[sx,sy]];seen.add(key(sx,sy));
  while(q.length){const [x,y]=q.pop();for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy,k=key(nx,ny);if(seen.has(k)||!walkable(m,nx,ny))continue;if(dx&&dy&&(!walkable(m,x+dx,y)||!walkable(m,x,y+dy)))continue;seen.add(k);q.push([nx,ny])}}
  let n=0;for(let y=0;y<m.h;y++)for(let x=0;x<W;x++){const k=key(x,y);if(!m.SOLID.has(k)&&!seen.has(k)){m.SOLID.add(k);n++}}m.sealed=n}

function patternFrom(m,test){for(const [lo,hi,sz] of [[-1,2,64],[0,1,64],[0,0,32]])for(let y=2;y<m.h-3;y++)for(let x=2;x<m.w-3;x++){let ok=true;for(let j=lo;j<=hi&&ok;j++)for(let i=lo;i<=hi;i++)if(!test(x+i,y+j)){ok=false;break}

  const stroke=(sh,fill,edge,extra)=>{if(!fill)return;g.save();g.lineCap='round';g.lineJoin='round';const path=()=>{g.beginPath();if(sh.oval){const [cx,cy,rx,ry]=sh.oval;g.ellipse(cx*T,cy*T,rx*T,ry*T,0,0,6.283)}else{sh.line.forEach(([x,y],i)=>i?g.lineTo(x*T,y*T):g.moveTo(x*T,y*T))}};

// ================= 1.09 LETTERS ON THE NEW VILLAGE (H9): post office + 8 homes =================
// Same letter game as the old village (3 letters a day, stamp at the post office). On H9 Grandpa Mek has his own house again, so 8 people can get mail there.
const H9_MAIL={post_office:'post_office',restaurant:'restaurant',clock_shop:'clock_shop',blacksmith:'blacksmith',house_w1:'house_daeng',house_w2:'house_fon',stall:'fruit_stall',house_e1:'house_dao',house_e2:'house_mek'};
const H9_WHERE={house_w2:['บ้านข้างบ้านยายแดง','the house next to Granny Daeng'],house_e1:['บ้านฝั่งตะวันออก ใกล้แผงผลไม้','the house east of the river, near the fruit stall'],house_e2:['บ้านหลังสุดท้ายทางตะวันออก','the last house in the east']};
try{if(!MAIL_TO.house_e2)MAIL_TO.house_e2=['ตาเมฆ','บ้านหลังสุดท้าย','☁️','Grandpa Mek','the last house']}catch(e){}
// the old village has no house for Grandpa Mek (it became our home there): letters picked in the old village never go to him
{const _mpH=mailPick;mailPick=function(){if(M&&M.h9)return _mpH.apply(this,arguments);const keep=MAIL_TO.house_e2;try{delete MAIL_TO.house_e2;return _mpH.apply(this,arguments)}finally{MAIL_TO.house_e2=keep}}}
// ================= 1.10 NEW-WORLD SWITCH · SHIPPING CRATE · CRYSTAL CROPS =================
// NEW-WORLD SWITCH: when on, the village everyone knows becomes the new H9 scene and home is at the G9 farm (start there, wake there, the cave leads back there).
// It is OFF for players (OPEN_NEW=false). The GM can turn it on for the GM character only, to play exactly what players will get. Opening it for everyone later = OPEN_NEW=true.
const OPEN_NEW=false;
const NEWW=()=>h9On()&&(OPEN_NEW||!!(S&&S.gm&&S.gmNew));
try{Object.assign(TX.th,{goalTownNew:'🎯 ไปถ้ำคริสตัล: ข้ามสะพานหิน แล้วขึ้นเนินทางขวาบน',crate:'กล่องส่งขาย',crateEmpty:'ยังไม่มีผลผลิตให้ขาย ไปเก็บผักที่แปลงก่อนนะ',crateSold:'ขายแล้ว',cryCrop:'คริสตัล',cryGot:'✨ ว้าว! ได้{n}คริสตัลเรืองแสง 1 ลูก ขายได้ 5 เท่า',crateTip:'ผลคริสตัลเรืองแสงขายได้ 5 เท่า'});
  if(TX.en)Object.assign(TX.en,{goalTownNew:'🎯 To the crystal cave: cross the stone bridge, then up the hill at the top right',crate:'Shipping crate',crateEmpty:'Nothing to sell yet. Harvest something first',crateSold:'Sold',cryCrop:'crystal',cryGot:'✨ Wow! A glowing crystal {n}. It sells for 5 times as much',crateTip:'Glowing crystal crops sell for 5 times as much'})}catch(e){}
const _goalTownOld={th:TX.th.goalTown,en:TX.en&&TX.en.goalTown};
function newwApply(){try{const on=NEWW();TX.th.goalTown=on?TX.th.goalTownNew:_goalTownOld.th;if(TX.en)TX.en.goalTown=on?TX.en.goalTownNew:_goalTownOld.en}catch(e){}}
{const _gmN=goMap;goMap=function(id,exitId,atStone){try{if(NEWW()&&(id==='capital'||(OLD_WORLD(id)&&!OLD_OK()))){
    if(exitId==='home'&&g9On()){id='farm'}else{exitId=exitId==='n'?'cave':exitId==='w'?'w':null;id='h9';atStone=false}
    return _gmN.call(this,id,exitId,atStone)}}catch(e){}return _gmN.apply(this,arguments)}}
{const _sgN=startGame;startGame=function(){try{newwApply();if(NEWW()&&S&&S.pos&&(S.pos.map==='capital'||OLD_WORLD(S.pos.map)))S.pos=null}catch(e){}return _sgN.apply(this,arguments)}}
// SHIPPING CRATE on the farm: tap it to sell what you grew (crystal crops sell for 5x)
function crateRows(h){const out=[];for(const k of Object.keys(CROPS)){const n=(h.pantry&&h.pantry[k])||0,c=(h.cry&&h.cry[k])||0;if(n>0)out.push({k,n,p:CROPS[k].price,cry:0});if(c>0)out.push({k,n:c,p:CROPS[k].price*5,cry:1})}return out}
function crateSell(k,cry,all){const h=HOME.get(),bag=cry?(h.cry=h.cry||{}):h.pantry,have=bag[k]||0;if(have<=0)return 0;const n=all?have:1,gain=n*CROPS[k].price*(cry?5:1);bag[k]=have-n;HOME.put(h);S.coins+=gain;save();try{hud()}catch(e){}sfx('coin');return gain}
function openCrate(){const h=HOME.get(),rows=crateRows(h);
  modal('<h2>📦 '+t('crate')+'</h2>'+(rows.length?'<div style="max-height:56vh;overflow:auto">'+rows.map(r=>'<div class="pn" style="display:flex;align-items:center;gap:8px;margin:6px 0"><div style="flex:1;font-size:16px">'+(r.cry?'✨ ':'🧺 ')+t('cr_'+r.k)+(r.cry?t('cryCrop'):'')+' ×'+r.n+' <span style="opacity:.8">· '+r.p+' 🪙</span></div><button data-cs="'+r.k+':'+r.cry+':0" style="min-height:40px">'+t('sell1')+'</button><button data-cs="'+r.k+':'+r.cry+':1" style="min-height:40px">'+t('sellAll')+' +'+(r.n*r.p)+'</button></div>').join('')+'</div><p class="note" style="font-size:14px">'+t('crateTip')+'</p>':'<p class="note" style="font-size:16px">'+t('crateEmpty')+'</p>'));
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{const [k,c,a]=b.dataset.cs.split(':');const g=crateSell(k,c==='1',a==='1');if(g)say('📦 '+t('crateSold')+' +'+g+' 🪙');openCrate()})}
{const cv=document.getElementById('c');if(cv)cv.addEventListener('pointerup',ev=>{try{if(!M||!M.crate||PAUSE||DLG)return;const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1,wx=(ev.clientX-r.left)*dpr/SC+camX,wy=(ev.clientY-r.top)*dpr/SC+camY;
    if(Math.abs(M.crate.x-wx)<40&&wy>M.crate.y-64&&wy<M.crate.y+8){ev.stopImmediatePropagation();window._farmTapT=performance.now();g9WalkThen(M.crate.x,M.crate.y+22,openCrate)}}catch(e){}},true)}
// CRYSTAL CROPS: a harvest by hand has a small chance to also give one glowing crystal crop
const CRY_CHANCE=.05;
{const _paC=plotAct;plotAct=function(p){let crop=null;try{const q=plotState(p),Q=HOME.get().plots[p.i];if(Q&&q.st==='ripe')crop=Q.crop}catch(e){}const r=_paC.apply(this,arguments);
  try{if(crop&&!HOME.get().plots[p.i]&&Math.random()<((gmOn()&&GM.luck)?1:CRY_CHANCE)){const h=HOME.get();h.cry=h.cry||{};h.cry[crop]=(h.cry[crop]||0)+1;HOME.put(h);sfx('lvl');
    for(let i=0;i<20;i++)FX.push({k:'star',x:p.x,y:p.y-14,vx:Math.cos(i/20*6.28)*70,vy:Math.sin(i/20*6.28)*70-30,t:0,life:1.1});setTimeout(()=>say(t('cryGot').replace('{n}',t('cr_'+crop))),900)}}catch(e){}return r}}
// GM panel: the two new switches
{const _ogN=openGM;openGM=function(){const r=_ogN.apply(this,arguments);try{const h2=document.querySelector('#modal h2');if(h2&&gmOn()){const d=document.createElement('div');d.className='pn';d.style.margin='6px 0';const on='background:#e8c46a;color:#1b1330;';
    d.innerHTML='<b>โลกใหม่</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><button id="gmNeww" style="min-height:40px;'+(S.gmNew?on:'')+'">เล่นแบบผู้เล่นจริงในโลกใหม่ (H9 + G9)</button><button id="gmLuck" style="min-height:40px;'+(GM.luck?on:'')+'">ผลคริสตัล 100%</button></div>';h2.after(d);
    $('gmNeww').onclick=()=>{S.gmNew=!S.gmNew;save();newwApply();closeModal();try{for(const k of Object.keys(CACHE))delete CACHE[k]}catch(e){}fadeTo(()=>goMap('capital'))};$('gmLuck').onclick=()=>{GM.luck=!GM.luck;openGM()}}}catch(e){}return r}}
