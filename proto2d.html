let ground;function makeGround(){ground=document.createElement('canvas');ground.width=MW*T;ground.height=MH*T;const g=ground.getContext('2d');g.imageSmoothingEnabled=false;

  for(let y=0;y<=MH;y++)for(let x=0;x<=MW;x++){const k=[[x-1,y-1],[x,y-1],[x-1,y],[x,y]].map(([a,b])=>grass(a,b)?'W':'F').join('');let [tx,ty]=WANG[k];if(k==='FFFF'&&r()<.5){tx=0;ty=3}
    if(k==='WWWW'&&r()<.5){g.save();g.translate(x*T-16+T,y*T-16);g.scale(-1,1);g.drawImage(IMG.ground,tx*T,ty*T,T,T,0,0,T,T);g.restore()}else g.drawImage(IMG.ground,tx*T,ty*T,T,T,x*T-16,y*T-16,T,T)}

  for(let i=0;i<260;i++){const x=Math.floor(r()*MW*T),y=Math.floor(r()*MH*T);if(PATH.has(key(Math.floor(x/T),Math.floor(y/T))))continue;
    const kind=r();if(kind<.35){g.fillStyle='rgba(30,70,30,.16)';for(let j=0;j<18;j++)g.fillRect(x+Math.floor(r()*14)-7,y+Math.floor(r()*8)-4,1,1)}
    else if(kind<.85){g.fillStyle='#3d7a3a';g.fillRect(x,y,1,3);g.fillRect(x+2,y+1,1,2);g.fillStyle='#8fd06a';g.fillRect(x+1,y-1,1,3)}
    else{g.fillStyle=['#fff6d8','#ffd6e6','#fff0a0'][Math.floor(r()*3)];g.fillRect(x,y,1,1);g.fillStyle='#3d7a3a';g.fillRect(x,y+1,1,1)}}
  // darker grass rim at the world edge (a forest border)
  const gr=g.createLinearGradient(0,0,0,40);gr.addColorStop(0,'rgba(10,30,15,.55)');gr.addColorStop(1,'rgba(10,30,15,0)');g.fillStyle=gr;g.fillRect(0,0,MW*T,40)}
