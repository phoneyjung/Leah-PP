<script>
// G2 Pilot motion harness (Claude · 16 Oct 2569). Separate test page: no index.html / sw.js / save / Firebase.
// Draws the locked c2 sprites as drawn (no recolour - not part of this test) following DESIGN_CHAR2_RENDER_CONTRACT.md.
// G2.2b hold mode (?hold): walk_hold sheet + stand-in Set-08 L0 lantern at the measured hand anchors (c2-pilot-hold-anchors.json),
// camera-side hand (D-HAND), N draws no lantern, lantern in front + fist pixels redrawn over the ring, D-EASE <= 3 art px per 100 ms per axis
// (default step ease = D-EASE-STEP, owner 17 Oct; smooth and snap stay selectable for comparison).
// No rotation, no scaling of the lantern; Pilot only (not index.html / sw.js / save).
// G2.5a GM lantern (?gm · owner 25 Oct 2569 ~11:0x): the accepted L0 lantern S (Codex fix4 44d2b62, c2-held-lantern_L0-S-trial*) replaces the Set-08
// stand-in, with its light layer, power 100/50/10/0 %, Glow (lit only, behind the body) + C (visibility pool) and light / dark / cave scenes.
// SIZE PREVIEW ONLY: the S cell is reused in all 8 columns at load (code composition, the asset files are untouched) until set 14 brings E/W.
// Missing base png or json -> no lantern at all (never the Set-08 stand-in) · missing light layer -> no light and no glow. Without ?gm the page is unchanged.
'use strict';
const C=96, FEET=[48,94], DIRS=['S','SE','E','NE','N','NW','W','SW'];
const DV={S:[0,1],SE:[1,1],E:[1,0],NE:[1,-1],N:[0,-1],NW:[-1,-1],W:[-1,0],SW:[-1,1]};
const OFF_TABLE={S:0,SE:0,E:3,NE:1,N:1,NW:-1,W:-1,SW:0};          // PILOT TEST ONLY (owner 16 Oct) · W -1 (formula -2) + shadow follows: Claude decision under team rule 0.2 after measurement
const ST={off:true,shadowFollow:true,zoom:1,dark:false,tag:'feet',guides:false,dir:'S',anim:'idle',fi:0,t:0,blinkAt:4000,pos:{x:160,y:120},moving:false,mv:null,
  log:[],img:{},anc:null,ok:{walk:false,idle:false,anc:false,walkhold:false,lantern:false,hold:false},
  hold:false,ease:true,easeStep:true,lpos:null,ldir:null,lhist:null,lclock:0,   // default = step ease (owner 17 Oct ~01:3x, D-EASE-STEP)
  gm:false,power:100,fx:true,scene:'light',lanHang:null,gmFiles:{base:false,light:false,json:false}};   // GM lantern (?gm): power %, Glow+C on/off, scene light/dark/cave
const EASE_PX_PER_MS=0.03, EASE_MAX=3, EASE_WIN=120, LAN_HANG=[16,6], LAN_CELL=32;   // step ease looks back 120 ms = 100 ms rule + 20 ms for frame-time jitter           // D-EASE: 3 art px per 100 ms · stand-in lantern hangs from its ring centre (16,6)
const WALL={x:200,y:60,w:16,h:120};                                 // simple collision box (world px) to prove offset never moves world/collision
const IDLE_LOOP=[0,1,2,1], WALK_MS=100, IDLE_MS=200, SPEED=48;     // px per second (art px)
const cv=document.getElementById('cv'), g=cv.getContext('2d');
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
// --- per-frame geometry from the real pixels (body centre rows 52-86, contact rows 92-94, head rows<=50)
const GEO={};
function geo(img,anim,nf){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
  const D=x.getImageData(0,0,img.width,img.height).data;GEO[anim]={};
  DIRS.forEach((d,i)=>{GEO[anim][d]=[];for(let k=0;k<nf;k++){let bs=0,bn=0,cs=0,cn=0,top=99,hs=0,hn=0,cmin=99,cmax=-1;
    for(let y=0;y<C;y++)for(let xx=0;xx<C;xx++){const a=D[((i*C+y)*img.width+k*C+xx)*4+3];if(!a)continue;if(y<top)top=y;
      if(y>=52&&y<=86){bs+=xx;bn++}if(y>=92&&y<=94){cs+=xx;cn++;cmin=Math.min(cmin,xx);cmax=Math.max(cmax,xx)}if(y<=50){hs+=xx;hn++}}
    GEO[anim][d].push({body:bs/bn,contact:cn?cs/cn:null,cmin,cmax,top,head:hs/hn})}})}
// W idle code breathing B (contract section 5): rows 0..61 up 1 px in f3, row 62 repeats - applied on a copy at load
function breatheW(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
  const w=DIRS.indexOf('W'),cut=62,k=2,sx=k*C,sy=w*C;const cell=x.getImageData(sx,sy,C,C);x.clearRect(sx,sy,C,C);
  const up=document.createElement('canvas');up.width=C;up.height=C;up.getContext('2d').putImageData(cell,0,0);
  x.drawImage(up,0,1,C,cut,sx,sy,C,cut);x.drawImage(up,0,cut,C,C-cut,sx,sy+cut,C,C-cut);return c}
async function boot(){
  const [w,i,wh,ln]=await Promise.all([load('c2-pilot-kid4-walk.png'),load('c2-pilot-kid4-idleanim.png'),load('c2-pilot-kid4-walkhold.png'),ST.gm?gmLantern():load('kid-lantern.png')]);
  try{ST.hanc=await (await fetch('c2-pilot-hold-anchors.json')).json();ST.ok.hold=!!(ST.hanc&&ST.hanc.walk_hold&&ST.hanc.idle_hold)}catch(e){ST.hanc=null}
  if(wh){ST.img.walkhold=wh;ST.ok.walkhold=true}
  if(ln){ST.img.lantern=ln;ST.ok.lantern=true}
  if(ST.gm){ST.img.caveFloor=await load('cave-floor.jpg');buildFx()}
  try{ST.anc=await (await fetch('c2-pilot-anchors.json')).json();ST.ok.anc=true;const dx=ST.anc.renderOffset&&ST.anc.renderOffset.dx;if(dx&&DIRS.every(d=>Number.isInteger(dx[d])))ST.offTable=Object.assign({},dx)}catch(e){ST.anc=null}
  if(ST.offWq!=null&&Number.isFinite(ST.offWq))ST.offTable=Object.assign({},ST.offTable||OFF_TABLE,{W:ST.offWq});   // ?offW=… test override, applied after the JSON
  // name-tag height: highest head of the whole character (all anims, all dirs) -> the tag never moves up/down
  ST.tagTop=ST.anc?Math.min(...['idle','walk'].flatMap(a=>DIRS.flatMap(d=>(ST.anc.frames[a]&&ST.anc.frames[a][d]||[]).map(f=>f.head_top[1])))):8;
  if(w){ST.img.walk=w;ST.ok.walk=true;geo(w,'walk',6)}
  if(i){ST.img.idle=breatheW(i);ST.ok.idle=true;geo(ST.img.idle,'idle',4)}
  if(!i&&w){ST.img.idle=null}                                       // fallback (contract section 7): idle missing -> walk f1
  buildFists();
  resize();sync();requestAnimationFrame(loop)}
// ---------- GM lantern: files, 8-column sheets (S cell reused), overlays built once at art resolution (stepped bands, no ctx.filter) ----------
const GM_BASE='c2-held-lantern_L0-S-trial', POWERS=[100,50,10,0];
const GM_POW={100:{light:1,glow:1,hole:1},50:{light:1,glow:0.5,hole:0.5},10:{light:0.35,glow:0,hole:0},0:{light:0,glow:0,hole:0}};   // plan G2.5 section 6: 50 % = half glow · 10 % = glint in the glass only · 0 % = dark glass, no glow
function sheet8(img){const c=document.createElement('canvas');c.width=8*LAN_CELL;c.height=LAN_CELL;const x=c.getContext('2d');for(let k=0;k<8;k++)x.drawImage(img,0,0,LAN_CELL,LAN_CELL,k*LAN_CELL,0,LAN_CELL,LAN_CELL);return c}
async function gmLantern(){
  const [b,l]=await Promise.all([load(GM_BASE+'.png'),load(GM_BASE+'-light.png')]);let j=null;
  try{j=await (await fetch(GM_BASE+'.json')).json()}catch(e){j=null}
  const grip=j&&Array.isArray(j.grip)&&j.grip.length===2&&j.grip.every(v=>Number.isInteger(v)&&v>=0&&v<LAN_CELL)?j.grip:null;
  ST.gmFiles={base:!!b,light:!!l,json:!!grip};
  if(!b||!grip||b.width!==LAN_CELL||b.height!==LAN_CELL)return null;            // base or json missing / wrong -> no lantern at all (spec 13 section 6)
  ST.lanHang=grip;if(l&&l.width===LAN_CELL&&l.height===LAN_CELL)ST.img.lanternLight=sheet8(l);
  return sheet8(b)}
const FX={};const DARK_A=0.86, DARK_RGB='8,6,18';
const GLOW={R:40,bands:[[8,0.26],[14,0.20],[20,0.15],[27,0.10],[34,0.06],[40,0.03]],col:[255,179,107]};   // stage-1 experiment values (ChatGPT scored B2+Glow+C with them)
const LHOLE={R:72,bands:[[20,1],[32,0.85],[44,0.65],[56,0.42],[66,0.22],[72,0.1]]};                     // cave lantern light radius = PLACEHOLDER, not a game rule
const LHOLE72=LHOLE.bands.map(b=>b.slice()), LR_SET=[72,100,130,160];   // owner 30 Oct 23:26 'light too narrow' -> GM try-out sizes · same band shape scaled to R (72 = unchanged)
function setLR(R){if(!LR_SET.includes(R))return;LHOLE.R=R;LHOLE.bands=LHOLE72.map(b=>[Math.round(b[0]*R/72),b[1]]);if(FX.lhole)FX.lhole=stampRadial(LHOLE.R,LHOLE.bands,[0,0,0])}
const NHOLE={cx:48,cy:84,k:1};   // O13 option D, candidate A (29 Oct): cave + facing N + held lit lantern -> the lantern stays hidden (D-HAND) but its light still opens the darkness: same LHOLE stamp, centre = feet [48,94] 10 px up (P2), alpha = power-table hole x k · GM ?nk=0..1 changes k (0 = the old N)
const POOL={cx:44,cy:66,rx:30,ry:34,bands:[[0.55,1],[0.8,0.62],[1,0.3]]}, POOL_FLAT={col:[74,68,102],a:0.55}, POOL_CAVE={a:0.45};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function stampRadial(R,bands,rgb){const c=mk(2*R+1,2*R+1),x=c.getContext('2d'),im=x.createImageData(2*R+1,2*R+1);
  for(let v=0;v<=2*R;v++)for(let u=0;u<=2*R;u++){const b=bands.find(b=>Math.hypot(u-R,v-R)<=b[0]);if(!b)continue;const o=(v*(2*R+1)+u)*4;
    im.data[o]=rgb[0];im.data[o+1]=rgb[1];im.data[o+2]=rgb[2];im.data[o+3]=Math.round(255*b[1])}x.putImageData(im,0,0);return c}
function stampPool(rgb,a){const c=mk(C,C),x=c.getContext('2d'),im=x.createImageData(C,C);
  for(let v=0;v<C;v++)for(let u=0;u<C;u++){const b=POOL.bands.find(b=>Math.hypot((u-POOL.cx)/POOL.rx,(v-POOL.cy)/POOL.ry)<=b[0]);if(!b)continue;const o=(v*C+u)*4;
    im.data[o]=rgb[0];im.data[o+1]=rgb[1];im.data[o+2]=rgb[2];im.data[o+3]=Math.round(255*b[1]*a)}x.putImageData(im,0,0);return c}
function buildFx(){FX.glow=stampRadial(GLOW.R,GLOW.bands,GLOW.col);FX.lhole=stampRadial(LHOLE.R,LHOLE.bands,[0,0,0]);
  FX.poolFlat=stampPool(POOL_FLAT.col,POOL_FLAT.a);FX.poolHole=stampPool([0,0,0],POOL_CAVE.a);FX.dark=mk(1,1)}   // cave darkness layer: resized to the screen (in art px) when drawn
function gmPow(){return GM_POW[ST.power]||GM_POW[0]}
function gmLit(){return ST.gm&&!!ST.img.lanternLight&&gmPow().light>0}
// fist overlay canvases: only the fist pixels of each frame (copied from the sheet itself) -> drawn over the lantern ring
const FIST={};
function buildFists(){if(!ST.hanc)return;[['idle','idle_hold',ST.img.idle,4],['walk','walk_hold',ST.img.walkhold,6]].forEach(([a,key,img,nf])=>{if(!img)return;FIST[a]={};
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
  DIRS.forEach((d,i)=>{FIST[a][d]=[];for(let k=0;k<nf;k++){const fr=(ST.hanc[key][d]||[])[k];if(!fr||!fr.fist){FIST[a][d].push(null);continue}
    const bx=Math.min(...fr.fist.map(p=>p[0])),by=Math.min(...fr.fist.map(p=>p[1])),bw=Math.max(...fr.fist.map(p=>p[0]))-bx+1,bh=Math.max(...fr.fist.map(p=>p[1]))-by+1;
    const o=document.createElement('canvas');o.width=bw;o.height=bh;const ox=o.getContext('2d');fr.fist.forEach(([fx,fy])=>ox.drawImage(c,k*C+fx,i*C+fy,1,1,fx-bx,fy-by,1,1));FIST[a][d].push({c:o,x:bx,y:by,w:bw,h:bh})}})})}
function holdOn(){return ST.hold&&ST.ok.hold&&ST.ok.lantern&&ST.ok.walkhold&&ST.ok.idle}   // spec 14.8 / QG-2b #10: walk_hold, idle, lantern or anchors missing -> old sheets, no lantern at all
function lanternTarget(){if(!holdOn())return null;const fr=(ST.hanc[ST.anim==='walk'?'walk_hold':'idle_hold'][ST.dir]||[])[curFrame()];return fr&&fr.anchor?fr.anchor:null}
function easeLantern(dt){const t=lanternTarget();if(!t){ST.lpos=null;ST.ldir=null;ST.lhist=null;return}
  const now=ST.lclock=(ST.lclock||0)+dt;
  if(!ST.lpos||ST.ldir!==ST.dir||!ST.ease){ST.lpos=[t[0],t[1]];ST.ldir=ST.dir;ST.lhist=[{t:now,p:[t[0],t[1]]}];return}   // direction change = hand switch -> snap
  ST.lhist=(ST.lhist||[]).filter(h=>now-h.t<=EASE_WIN);const H=ST.lhist.length?ST.lhist:[{p:ST.lpos.map(Math.round)}];
  const lim=a=>[Math.max(...H.map(h=>h.p[a]))-EASE_MAX,Math.min(...H.map(h=>h.p[a]))+EASE_MAX];   // drawn px allowed by every position drawn in the last EASE_WIN ms
  if(ST.easeStep){                                   // step ease: jump as far as the window allows (whole px) -> smallest gap to the fist
    ST.lpos=[0,1].map(a=>{const [lo,hi]=lim(a);return Math.min(hi,Math.max(lo,t[a]))})}
  else{const m=EASE_PX_PER_MS*dt,cl=v=>Math.max(-m,Math.min(m,v));ST.lpos=[ST.lpos[0]+cl(t[0]-ST.lpos[0]),ST.lpos[1]+cl(t[1]-ST.lpos[1])];   // smooth ease: 0.03 px/ms
    [0,1].forEach(a=>{const [lo,hi]=lim(a),r=Math.round(ST.lpos[a]);if(r<lo||r>hi)ST.lpos[a]=Math.min(hi,Math.max(lo,r))})}   // guard: rounding + frame jitter never give 4 px in 100 ms
  ST.lhist.push({t:now,p:ST.lpos.map(Math.round)})}
function resize(){const dpr=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
addEventListener('resize',resize);
function scale(){return Math.max(1,Math.round(cv.height/384))*ST.zoom}   // game formula (index.html: SC = max(1, round(h/384))): 3 at 100 %, 2.25 at 75 % on 844x390 @2.625 · never 0 on a canvas under 192 px (O3)
function offX(d){return ST.off?(ST.offTable||OFF_TABLE)[d]:0}
const BLINK_DIRS=['S','SE','E','W','SW'];
function curFrame(){if(ST.anim==='walk')return ST.fi%6;const li=ST.fi%4;return li===3&&ST.blinkNow&&BLINK_DIRS.includes(ST.dir)?3:IDLE_LOOP[li]}
function cam(){const s=scale();return{s,ox:Math.round(cv.width/2-ST.pos.x*s),oy:Math.round(cv.height/2-ST.pos.y*s)}}
function blocked(x,y){return x>WALL.x-6&&x<WALL.x+WALL.w+6&&y>WALL.y&&y<WALL.y+WALL.h}
function step(dt){
  ST.t+=dt;
  if(ST.moving&&ST.mv){const [vx,vy]=DV[ST.dir],n=Math.hypot(vx,vy),nx=ST.pos.x+vx/n*SPEED*dt/1000,ny=ST.pos.y+vy/n*SPEED*dt/1000;
    if(!blocked(nx,ny)){ST.pos.x=nx;ST.pos.y=ny}}
  const ms=ST.anim==='walk'?WALK_MS:IDLE_MS;
  if(ST.anim==='idle')ST.blinkClock=(ST.blinkClock||0)+dt;
  while(ST.t>=ms){ST.t-=ms;ST.fi++;
    if(ST.anim==='idle'){const li=ST.fi%4;ST.blinkNow=false;                       // blink = the f2 slot after f3 (loop index 3), every 3-6 s
      if(li===3&&ST.blinkClock>=ST.blinkAt){ST.blinkNow=true;ST.blinkClock=0;ST.blinkAt=3000+Math.random()*2200;ST.blinks=(ST.blinks||[]).concat([performance.now()])}}}
  easeLantern(dt)}
function draw(){
  if(ST.gm)ST.dark=ST.scene!=='light';const cave=ST.gm&&ST.scene==='cave';
  const {s,ox,oy}=cam(),bg=ST.clean?'#00ff00':cave?'#14121c':ST.dark?'#1e1b2e':'#e8e6f0';g.imageSmoothingEnabled=false;g.fillStyle=bg;g.fillRect(0,0,cv.width,cv.height);
  const fx=ox+ST.pos.x*s, fy=oy+ST.pos.y*s;                         // logical feet on screen
  if(!ST.clean){
  if(cave&&ST.img.caveFloor)for(let wy=Math.floor(-oy/s/256)*256;oy+wy*s<cv.height;wy+=256)for(let wx=Math.floor(-ox/s/256)*256;ox+wx*s<cv.width;wx+=256)g.drawImage(ST.img.caveFloor,0,0,256,256,ox+wx*s,oy+wy*s,256*s,256*s);   // floor tiles cover the whole screen at any zoom
  // ground grid (world) - 32 px tiles
  if(!cave){g.strokeStyle=ST.dark?'#2c2840':'#d6d3e2';g.lineWidth=1;for(let x=0;x<=400;x+=32){g.beginPath();g.moveTo(ox+x*s,oy);g.lineTo(ox+x*s,oy+300*s);g.stroke()}
  for(let y=0;y<=300;y+=32){g.beginPath();g.moveTo(ox,oy+y*s);g.lineTo(ox+400*s,oy+y*s);g.stroke()}}
  g.fillStyle=ST.dark?'#4a4060':'#b9b2cc';g.fillRect(ox+WALL.x*s,oy+WALL.y*s,WALL.w*s,WALL.h*s);
  // shadow under the drawn sprite: logical feet + renderOffset when shadowFollow (B2) · world position / collision never use the offset
  const shx=fx+(ST.shadowFollow?offX(ST.dir)*s:0);g.fillStyle='rgba(40,50,40,0.35)';g.beginPath();g.ellipse(shx,fy,14*s,3*s,0,0,7);g.fill();}
  const d=ST.dir,k=curFrame();let img,kk;
  const H=holdOn();
  if(ST.anim==='walk'&&H){img=ST.img.walkhold;kk=k}
  else if(ST.anim==='walk'){img=ST.img.walk||ST.img.idle;kk=ST.img.walk?k:0}        // walk missing -> idle f1 slides along the path (contract 7)
  else{img=ST.img.idle||ST.img.walk;kk=ST.img.idle?k:0}                          // idle missing -> walk f1
  const dx=offX(d),sx=Math.round(fx-FEET[0]*s+dx*s),sy=Math.round(fy-FEET[1]*s);
  const t=H?lanternTarget():null,HG=ST.lanHang||LAN_HANG;
  if(t&&(!ST.lpos||ST.ldir!==d)){ST.lpos=[t[0],t[1]];ST.ldir=d;ST.lhist=[{t:ST.lclock||0,p:[t[0],t[1]]}]}   // snap in draw is part of the history too
  const LW=t?[ST.pos.x-FEET[0]+dx+Math.round(ST.lpos[0])-HG[0],ST.pos.y-FEET[1]+Math.round(ST.lpos[1])-HG[1]]:null;   // lantern cell origin in world art px (glow / cave light)
  const P_=gmPow(),lit=gmLit();ST.gmDraw={glow:false,pool:false,light:0,caveHole:0};
  const cOn=ST.gm&&ST.fx&&!!t&&lit&&d!=='N';   // C pool (owner choice ค, 26 Oct): only with a held, drawn, lit lantern (lantern + light files ok, power > 0), not facing N, Glow+C on
  if(ST.gm&&!ST.clean&&ST.fx){   // behind the body: C pool on the flat dark floor, then the lit-only warm Glow (screen) - never over the face or fist
    if(ST.scene==='dark'&&cOn){g.drawImage(FX.poolFlat,0,0,C,C,sx,sy,C*s,C*s);ST.gmDraw.pool=true}
    if(lit&&LW&&P_.glow>0){g.globalAlpha=P_.glow;g.globalCompositeOperation='screen';const gx=LW[0]+16-GLOW.R,gy=LW[1]+15-GLOW.R;
      g.drawImage(FX.glow,0,0,2*GLOW.R+1,2*GLOW.R+1,ox+gx*s,oy+gy*s,(2*GLOW.R+1)*s,(2*GLOW.R+1)*s);g.globalCompositeOperation='source-over';g.globalAlpha=1;ST.gmDraw.glow=true}}
  if(img)g.drawImage(img,kk*C,DIRS.indexOf(d)*C,C,C,sx,sy,C*s,C*s);else{g.fillStyle='#c84';g.fillRect(fx-10*s,fy-40*s,20*s,40*s)}
  // lantern (G2.2b): in front of the body, then the fist pixels again over the ring · positions in art px of the cell, so renderOffset applies
