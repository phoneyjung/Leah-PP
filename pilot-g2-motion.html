<!doctype html>
<html lang="th"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>G2 Pilot · motion / renderOffset test</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e8e6f0;font:12px system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#ui{position:fixed;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:70%}
#ui button{font:12px system-ui;padding:6px 8px;border-radius:6px;border:1px solid #888;background:#fff}
#ui button.on{background:#ffd76a}
#pad{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,40px);gap:4px}
#pad button{height:40px;font-size:14px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui">
 <button id="bOff">Offset B (ตามตาราง) / table</button>
 <button id="bZoom">ซูม 100% / zoom</button>
 <button id="bBg">พื้นสว่าง / light</button>
 <button id="bTag">ป้าย: เท้า / tag: feet</button>
 <button id="bGuide">เส้นช่วย / guides</button>
</div>
<div id="pad"></div>
<script>
// G2 Pilot motion harness (Claude · 16 Oct 2569). Separate test page: no index.html / sw.js / save / Firebase.
// Draws the locked c2 sprites as drawn (no recolour - not part of this test) following DESIGN_CHAR2_RENDER_CONTRACT.md.
'use strict';
const C=96, FEET=[48,94], DIRS=['S','SE','E','NE','N','NW','W','SW'];
const DV={S:[0,1],SE:[1,1],E:[1,0],NE:[1,-1],N:[0,-1],NW:[-1,-1],W:[-1,0],SW:[-1,1]};
const OFF_TABLE={S:0,SE:0,E:3,NE:1,N:1,NW:-1,W:-1,SW:0};          // PILOT TEST ONLY (owner 16 Oct) · W -1 (formula -2) + shadow follows: Claude decision under team rule 0.2 after measurement
const ST={off:true,shadowFollow:true,zoom:1,dark:false,tag:'feet',guides:false,dir:'S',anim:'idle',fi:0,t:0,blinkAt:4000,pos:{x:160,y:120},moving:false,mv:null,
  log:[],img:{},anc:null,ok:{walk:false,idle:false,anc:false}};
const WALL={x:200,y:60,w:16,h:120};                                 // simple collision box (world px) to prove offset never moves world/collision
const IDLE_LOOP=[0,1,2,1], WALK_MS=100, IDLE_MS=200, SPEED=48;     // px per second (art px)
const cv=document.getElementById('cv'), g=cv.getContext('2d');
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
// --- per-frame geometry from the real pixels (body centre rows 52-86, contact rows 92-94, head rows<=50)
const GEO={};
function geo(img,anim,nf){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
  const D=x.getImageData(0,0,img.width,img.height).data;GEO[anim]={};
  DIRS.forEach((d,i)=>{GEO[anim][d]=[];for(let k=0;k<nf;k++){let bs=0,bn=0,cs=0,cn=0,top=99,hs=0,hn=0,cmin=99,cmax=-1;
    for(let y=0;y<C;y++)for(let xx=0;xx<C;xx++){const a=D[((i*C+y)*img.width+k*C+xx)*4+3];if(!a)continue;if(y<top)top=y;
      if(y>=52&&y<=86){bs+=xx;bn++}if(y>=92&&y<=94){cs+=xx;cn++;cmin=Math.min(cmin,xx);cmax=Math.max(cmax,xx)}if(y<=50){hs+=xx;hn++}}
    GEO[anim][d].push({body:bs/bn,contact:cn?cs/cn:null,cmin,cmax,top,head:hs/hn})}})}
// W idle code breathing B (contract section 5): rows 0..61 up 1 px in f3, row 62 repeats - applied on a copy at load
function breatheW(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
  const w=DIRS.indexOf('W'),cut=62,k=2,sx=k*C,sy=w*C;const cell=x.getImageData(sx,sy,C,C);x.clearRect(sx,sy,C,C);
  const up=document.createElement('canvas');up.width=C;up.height=C;up.getContext('2d').putImageData(cell,0,0);
  x.drawImage(up,0,1,C,cut,sx,sy,C,cut);x.drawImage(up,0,cut,C,C-cut,sx,sy+cut,C,C-cut);return c}
async function boot(){
  const [w,i]=await Promise.all([load('c2-pilot-kid4-walk.png'),load('c2-pilot-kid4-idleanim.png')]);
  try{ST.anc=await (await fetch('c2-pilot-anchors.json')).json();ST.ok.anc=true}catch(e){ST.anc=null}
  if(w){ST.img.walk=w;ST.ok.walk=true;geo(w,'walk',6)}
  if(i){ST.img.idle=breatheW(i);ST.ok.idle=true;geo(ST.img.idle,'idle',4)}
  if(!i&&w){ST.img.idle=null}                                       // fallback (contract section 7): idle missing -> walk f1
  resize();requestAnimationFrame(loop)}
function resize(){const dpr=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
addEventListener('resize',resize);
function scale(){return Math.round(cv.height/384)*ST.zoom}          // game formula: 3 at 100 %, 2.25 at 75 % on 844x390 @2.625
function offX(d){return ST.off?(ST.offTable||OFF_TABLE)[d]:0}
const BLINK_DIRS=['S','SE','E','W','SW'];
function curFrame(){if(ST.anim==='walk')return ST.fi%6;const li=ST.fi%4;return li===3&&ST.blinkNow&&BLINK_DIRS.includes(ST.dir)?3:IDLE_LOOP[li]}
function cam(){const s=scale();return{s,ox:Math.round(cv.width/2-ST.pos.x*s),oy:Math.round(cv.height/2-ST.pos.y*s)}}
function blocked(x,y){return x>WALL.x-6&&x<WALL.x+WALL.w+6&&y>WALL.y&&y<WALL.y+WALL.h}
function step(dt){
  ST.t+=dt;
  if(ST.moving&&ST.mv){const [vx,vy]=DV[ST.dir],n=Math.hypot(vx,vy),nx=ST.pos.x+vx/n*SPEED*dt/1000,ny=ST.pos.y+vy/n*SPEED*dt/1000;
    if(!blocked(nx,ny)){ST.pos.x=nx;ST.pos.y=ny}}
  const ms=ST.anim==='walk'?WALK_MS:IDLE_MS;
  if(ST.anim==='idle')ST.blinkClock=(ST.blinkClock||0)+dt;
  while(ST.t>=ms){ST.t-=ms;ST.fi++;
    if(ST.anim==='idle'){const li=ST.fi%4;ST.blinkNow=false;                       // blink = the f2 slot after f3 (loop index 3), every 3-6 s
      if(li===3&&ST.blinkClock>=ST.blinkAt){ST.blinkNow=true;ST.blinkClock=0;ST.blinkAt=3000+Math.random()*2200;ST.blinks=(ST.blinks||[]).concat([performance.now()])}}}}
function draw(){
  const {s,ox,oy}=cam(),bg=ST.clean?'#00ff00':ST.dark?'#1e1b2e':'#e8e6f0';g.imageSmoothingEnabled=false;g.fillStyle=bg;g.fillRect(0,0,cv.width,cv.height);
  const fx=ox+ST.pos.x*s, fy=oy+ST.pos.y*s;                         // logical feet on screen
  if(!ST.clean){
  // ground grid (world) - 32 px tiles
  g.strokeStyle=ST.dark?'#2c2840':'#d6d3e2';g.lineWidth=1;for(let x=0;x<=400;x+=32){g.beginPath();g.moveTo(ox+x*s,oy);g.lineTo(ox+x*s,oy+300*s);g.stroke()}
  for(let y=0;y<=300;y+=32){g.beginPath();g.moveTo(ox,oy+y*s);g.lineTo(ox+400*s,oy+y*s);g.stroke()}
  g.fillStyle=ST.dark?'#4a4060':'#b9b2cc';g.fillRect(ox+WALL.x*s,oy+WALL.y*s,WALL.w*s,WALL.h*s);
  // shadow at the logical feet (never shifted by renderOffset)
  const shx=fx+(ST.shadowFollow?offX(ST.dir)*s:0);g.fillStyle='rgba(40,50,40,0.35)';g.beginPath();g.ellipse(shx,fy,14*s,3*s,0,0,7);g.fill();}
  const d=ST.dir,k=curFrame(),img=ST.anim==='walk'||!ST.img.idle?ST.img.walk:ST.img.idle,kk=(ST.anim==='idle'&&!ST.img.idle)?0:k;
  const dx=offX(d),sx=Math.round(fx-FEET[0]*s+dx*s),sy=Math.round(fy-FEET[1]*s);
  if(img)g.drawImage(img,kk*C,DIRS.indexOf(d)*C,C,C,sx,sy,C*s,C*s);else{g.fillStyle='#c84';g.fillRect(fx-10*s,fy-40*s,20*s,40*s)}
  // name tag: policy 'feet' = x from logical feet, y = highest head top of this anim+dir; policy 'head' = head_top of this frame (+offset)
  const an=ST.anc&&ST.anc.frames[ST.anim]?ST.anc.frames[ST.anim][d]:null, fr=an?an[kk]:null;
  let tx,ty;if(ST.tag==='feet'){const tops=an?an.map(f=>f.head_top[1]):[8];tx=fx;ty=fy+(Math.min(...tops)-FEET[1]-4)*s}
  else{tx=fr?fx+(fr.head_top[0]-FEET[0]+dx)*s:fx;ty=fr?fy+(fr.head_top[1]-FEET[1]-4)*s:fy-90*s}
  if(!ST.clean){g.font=Math.round(5*s)+'px system-ui';g.textAlign='center';g.textBaseline='bottom';const label='ลีอา Leah';const tw=g.measureText(label).width;
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(Math.round(tx-tw/2-2*s),Math.round(ty-6*s),Math.round(tw+4*s),Math.round(6*s));g.fillStyle='#fff';g.fillText(label,Math.round(tx),Math.round(ty-0.6*s));}
  ST.last={s,fx,fy,sx,sy,dx,dir:d,anim:ST.anim,frame:kk,tag:[tx,ty],headTop:fr?[fx+(fr.head_top[0]-FEET[0]+dx)*s,fy+(fr.head_top[1]-FEET[1])*s]:null,pos:{...ST.pos}};
  if(ST.guides){g.strokeStyle='#e33';g.beginPath();g.moveTo(fx-6*s,fy);g.lineTo(fx+6*s,fy);g.moveTo(fx,fy-6*s);g.lineTo(fx,fy+6*s);g.stroke();
    if(ST.last.headTop){g.strokeStyle='#36f';g.strokeRect(ST.last.headTop[0]-2*s,ST.last.headTop[1]-2*s,4*s,4*s)}}
}
function loop(ts){const now=ts||0,dt=Math.min(100,now-(ST.lt||now));ST.lt=now;if(!ST.paused)step(dt);draw();requestAnimationFrame(loop)}
// --- controls (keyboard + pad) and a test API
function setDir(d){ST.dir=d}
function walk(d){ST.dir=d;if(ST.anim!=='walk'){ST.anim='walk';ST.fi=0;ST.t=0}ST.moving=true;ST.mv=true}
function stop(){if(ST.anim==='walk'){ST.anim='idle';ST.fi=2;ST.t=0}ST.moving=false;ST.mv=null}   // contract: stop -> idle starts at f3 (loop index 2)
const pad=document.getElementById('pad');['NW','N','NE','W','·','E','SW','S','SE'].forEach(d=>{const b=document.createElement('button');b.textContent=d;
  if(d==='·'){b.onpointerdown=stop}else{b.onpointerdown=()=>walk(d);b.onpointerup=b.onpointerleave=stop}pad.appendChild(b)});
const KEYS={ArrowUp:'N',ArrowDown:'S',ArrowLeft:'W',ArrowRight:'E'};const held=new Set();
addEventListener('keydown',e=>{if(!KEYS[e.key])return;held.add(KEYS[e.key]);kd()});addEventListener('keyup',e=>{if(!KEYS[e.key])return;held.delete(KEYS[e.key]);kd()});
function kd(){const n=held.has('N'),s=held.has('S'),w=held.has('W'),e=held.has('E');const d=(n?'N':s?'S':'')+(e?'E':w?'W':'');d?walk(d):stop()}
const tg=(id,f)=>{const b=document.getElementById(id);b.onclick=()=>{f();sync()}};
tg('bOff',()=>ST.off=!ST.off);tg('bZoom',()=>ST.zoom=ST.zoom===1?0.75:1);tg('bBg',()=>ST.dark=!ST.dark);tg('bTag',()=>ST.tag=ST.tag==='feet'?'head':'feet');tg('bGuide',()=>ST.guides=!ST.guides);
function sync(){const B=(id,on,t)=>{const b=document.getElementById(id);b.classList.toggle('on',on);b.textContent=t};
  B('bOff',ST.off,ST.off?'Offset B (ตามตาราง) / table':'Offset A = 0');B('bZoom',ST.zoom===1,ST.zoom===1?'ซูม 100% / zoom':'ซูม 75% / zoom');
  B('bBg',ST.dark,ST.dark?'พื้นมืด / dark':'พื้นสว่าง / light');B('bTag',ST.tag==='feet',ST.tag==='feet'?'ป้าย: เท้า / tag: feet':'ป้าย: หัว / tag: head');B('bGuide',ST.guides,'เส้นช่วย / guides')}
const q=new URLSearchParams(location.search);if(q.has('off0'))ST.off=false;if(q.has('z75'))ST.zoom=0.75;if(q.has('dark'))ST.dark=true;if(q.has('guides'))ST.guides=true;if(q.get('tag')==='head')ST.tag='head';if(q.has('clean'))ST.clean=true;if(q.has('offW'))ST.offTable=Object.assign({},OFF_TABLE,{W:+q.get('offW')});if(q.has('shadowFixed'))ST.shadowFollow=false;
window.PT={ST,GEO,OFF_TABLE,DIRS,setDir,walk,stop,draw,scale,step,curFrame,pause:v=>ST.paused=v,set:(o)=>Object.assign(ST,o)};
sync();boot();
</script></body></html>
