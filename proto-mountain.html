  if(STONE.state){ctx.save();ctx.globalCompositeOperation='lighter';const x=STONE.x-camX,y=STONE.y-camY-50,h=70*sp,g=ctx.createLinearGradient(0,y-h,0,y);g.addColorStop(0,'rgba(140,235,255,0)');g.addColorStop(1,`rgba(140,235,255,${.35*sp})`);ctx.fillStyle=g;ctx.fillRect(x-5,y-h,10,h);
    for(let i=0;i<6;i++){const py=y-((t*22+i*12)%70);ctx.fillStyle='rgba(220,252,255,.9)';ctx.fillRect(Math.round(x+Math.sin(t*2+i)*7),Math.round(py),1,1)}ctx.restore()}
  for(const p of petals){p.y+=p.v*dt;p.x+=Math.sin(t+p.p)*8*dt+4*dt;if(p.y>MH*T)p.y=-4;if(p.x>MW*T)p.x=0;ctx.fillStyle='#ffc6da';ctx.fillRect(Math.round(p.x-camX),Math.round(p.y-camY),2,1)}
  const k=1-L;if(k>.01){ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${Math.round(255-k*110)},${Math.round(255-k*85)},${Math.round(255-k*55)})`;ctx.fillRect(0,0,VW,VH)}
  ctx.globalCompositeOperation='lighter';const gl=(x,y,rr,col,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-rr,y-rr,rr*2,rr*2)};
  for(const [x,y] of [[14*T+38,10*T-44],[19*T+38,10*T-44],[17*T-34,7*T-56],[17*T+34,7*T-56]])gl(x-camX,y-camY,16,'rgba(255,200,120,A)',.22+.4*k);
  ctx.globalCompositeOperation='source-over';vig.style.opacity=(1.25-.35*L).toFixed(2);drawMinimap(t)}
function start(){OBJ.forEach(measure);leah.silI=silOf(IMG.lidle);leah.silW=silOf(IMG.lwalk);makeGround();makeMinimap();resize();requestAnimationFrame(frame)}
