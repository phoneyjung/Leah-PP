<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Leah พาเพลิน · สร้างผู้พิทักษ์แสง (ต้นแบบ)</title>
<style>
:root{--ink:#fdf6e8;--bg:#1b1330;--gold:#a8793a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(ellipse at 30% 40%,#2c3f5a,#140d24 70%);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
.wrap{position:fixed;inset:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.pn{background:rgba(27,19,48,.92);box-shadow:0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold),0 7px 0 0 rgba(0,0,0,.35);padding:10px}
.left{flex:0 0 42%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative}
.right{flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:6px 6px 10px}
h1{font-size:17px;margin:0 0 2px;color:#ffe7b0;text-align:center;letter-spacing:.5px}
h2{font-size:13px;margin:0 0 6px;color:#ffe7b0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#stage{display:block}
.turn{display:flex;gap:10px;align-items:center}
button{font:inherit;color:var(--ink);background:#3a2a58;border:0;padding:8px 12px;cursor:pointer;box-shadow:0 -2px 0 0 #6d5a96,0 2px 0 0 #120b22,-2px 0 0 0 #6d5a96,2px 0 0 0 #120b22}
button:active{transform:translateY(1px)}
.kids{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.kid{padding:4px 0 2px;background:#2a2044;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.kid.on{background:#5a4690;box-shadow:0 0 0 3px #ffe7b0}
.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.house{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:#1b1330;font-weight:700}
.house.on{box-shadow:0 0 0 3px #fff,0 0 12px 3px rgba(255,255,255,.5)}
.row{display:flex;gap:8px;align-items:center}
input{flex:1;font:inherit;font-size:15px;padding:8px;border:0;background:#fdf6e8;color:#1b1330;min-width:0}
.go{background:#c98a2e;color:#1b1330;font-weight:800;font-size:15px;padding:10px}
.note{font-size:11px;opacity:.75}
#done{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,20,.7)}
#done .pn{text-align:center;max-width:320px}
</style></head><body>
<div class="wrap">
 <div class="left pn">
  <h1>สร้างผู้พิทักษ์แสง</h1>
  <canvas id="stage" width="120" height="120"></canvas>
  <div class="turn"><button id="tl">◀</button><span id="nm" style="min-width:110px;text-align:center;font-weight:700">ผู้พิทักษ์</span><button id="tr">▶</button></div>
  <div class="note">แตะ ◀ ▶ เพื่อหมุนตัว</div>
  <button class="go" id="go">✨ เริ่มผจญภัย</button>
 </div>
 <div class="right">
  <div class="pn"><h2>1 · เลือกตัวละคร</h2><div class="kids" id="kids"></div></div>
  <div class="pn"><h2>2 · เลือกบ้านของเรา <span class="note">(บ้านเดียวกับที่โรงเรียน)</span></h2><div class="houses" id="houses"></div></div>
  <div class="pn"><h2>3 · ตั้งชื่อเล่น</h2><div class="row"><input id="name" maxlength="12" placeholder="ชื่อเล่นของเรา"><button id="rnd" title="สุ่ม">🎲 สุ่ม</button></div></div>
</div>
</div>
<div id="done"><div class="pn"><h1 id="dt"></h1><canvas id="dc" width="96" height="96"></canvas><p class="note" id="dn"></p><button id="back">กลับไปแก้</button></div></div>
