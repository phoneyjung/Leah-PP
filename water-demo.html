const Z=2, cv=document.getElementById('c'), ctx=cv.getContext('2d'), msg=document.getElementById('msg');
const Q=new URLSearchParams(location.search), FAST=Q.has('fast');
const OPT={pads:true,glint:true,wave:true};
const img=src=>new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(new Error('โหลดภาพไม่ได้'));i.src='data:image/png;base64,'+src});
// each pad group gets its own slow rhythm, so they never move together
const PADS=D.pads.map((p,i)=>({sx:p[0],sy:p[1],w:p[2],h:p[3],x:p[4],y:p[5],ph:i*1.7+0.4,sp:0.75+((i*37)%10)/22,amp:0.7+((i*13)%7)/10}));
function padOffset(p,t){return OPT.pads?[Math.cos(t*p.sp*0.62+p.ph)*0.6*p.amp, Math.sin(t*p.sp+p.ph)*1.1*p.amp]:[0,0]}
// fish: a dark soft shape under the surface, swims a gentle curve between two deep-water points, fades in and out
const FISH=[]; let nextFish=FAST?0.5:6+Math.random()*10;
function fishDelay(){return FAST?1.5+Math.random()*1.5:15+Math.random()*25}
function spawnFish(t){const P=D.deep;let a,b,tries=0;do{a=P[(Math.random()*P.length)|0];b=P[(Math.random()*P.length)|0];tries++}while(Math.hypot(a[0]-b[0],a[1]-b[1])<90&&tries<40);
  const mx=(a[0]+b[0])/2+(Math.random()-.5)*60, my=(a[1]+b[1])/2+(Math.random()-.5)*40;
  FISH.push({a,b,c:[mx,my],t0:t,dur:5.5+Math.random()*3,size:0.85+Math.random()*0.5,wob:Math.random()*6});RINGS.push({x:a[0],y:a[1],t0:t+0.5})}
function fishPos(f,u){const v=1-u;return [v*v*f.a[0]+2*v*u*f.c[0]+u*u*f.b[0], v*v*f.a[1]+2*v*u*f.c[1]+u*u*f.b[1]]}
const fishLayer=document.createElement('canvas');fishLayer.width=D.w;fishLayer.height=D.h;const fx=fishLayer.getContext('2d');
function drawFish(t,clip){fx.clearRect(0,0,D.w,D.h);
  for(let i=FISH.length-1;i>=0;i--){const f=FISH[i],u=(t-f.t0)/f.dur;if(u>=1){FISH.splice(i,1);continue}
    const [x,y]=fishPos(f,u),[x2,y2]=fishPos(f,Math.min(1,u+0.02)),ang=Math.atan2(y2-y,x2-x),al=Math.min(1,u/0.14,(1-u)/0.14)*0.30,L=13*f.size,Wd=4.6*f.size,tail=Math.sin(t*7+f.wob)*0.45;
    f.x=x;f.y=y;fx.save();fx.translate(x,y);fx.rotate(ang);fx.fillStyle='rgba(14,40,92,'+al.toFixed(3)+')';
    fx.beginPath();fx.ellipse(0,0,L,Wd,0,0,6.283);fx.fill();
    fx.beginPath();fx.moveTo(-L*0.8,0);fx.lineTo(-L*1.55,-Wd*1.1+tail*4);fx.lineTo(-L*1.55,Wd*1.1+tail*4);fx.closePath();fx.fill();fx.restore()}
  fx.globalCompositeOperation='destination-in';fx.drawImage(clip,0,0);fx.globalCompositeOperation='source-over'}   // a fish never shows over reeds, rocks or the dock
// the water surface: every 2-px row of the painted water slides a pixel or two left and right, each row on its own slow rhythm.
// Redrawn about 12 times a second (pixel-art pace) into its own layer, cut to the water only, so banks, rocks, reeds and the dock never move.
const waveLayer=document.createElement('canvas');waveLayer.width=D.w;waveLayer.height=D.h;const wx=waveLayer.getContext('2d');let waveAt=-1;
function rowShift(y,t){return Math.round(Math.sin(t*1.5+y*0.23)*1.0+Math.sin(t*0.8+y*0.071+1.3)*0.7)}
function drawWave(t,bg,mask){if(t-waveAt<0.08)return;waveAt=t;const [x0,y0,x1,y1]=D.waveBox;wx.globalCompositeOperation='source-over';wx.clearRect(0,0,D.w,D.h);
  for(let y=y0;y<y1;y+=2)wx.drawImage(bg,x0-3,y,x1-x0+6,2,x0-3+rowShift(y,t),y,x1-x0+6,2);
  wx.globalCompositeOperation='destination-in';wx.drawImage(mask,0,0);wx.globalCompositeOperation='source-over'}
// rings: where a fish comes up, one soft ring spreads and fades
const RINGS=[];
function drawRings(t){for(let i=RINGS.length-1;i>=0;i--){const r=RINGS[i],u=(t-r.t0)/1.4;if(u>=1){RINGS.splice(i,1);continue}if(u<0)continue;
    ctx.strokeStyle='rgba(235,248,255,'+((1-u)*0.55).toFixed(3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(r.x,r.y,3+u*13,(3+u*13)*0.5,0,0,6.283);ctx.stroke()}}
// glints: tiny bright marks on the open water that fade in and out
const GL=[];for(let i=0;i<16;i++){const p=D.deep[(i*37+11)%D.deep.length];GL.push({x:p[0]+((i*29)%17)-8,y:p[1]+((i*17)%11)-5,ph:i*2.1,sp:0.5+((i*7)%5)/7})}
let T0=null,frames=0,lastFps=0,fps=0;
async function start(){let bg,pads,clip,wv;
  try{[bg,pads,clip,wv]=await Promise.all([img(D.bg),img(D.padsImg),img(D.clip),img(D.wave)])}catch(e){msg.textContent='โหลดภาพไม่สำเร็จ ลองรีเฟรชหน้า';return}
  // the clip picture is white where water is: turn it into an alpha mask once
  const cm=document.createElement('canvas');cm.width=D.w;cm.height=D.h;const cx=cm.getContext('2d');cx.drawImage(clip,0,0);const id=cx.getImageData(0,0,D.w,D.h);for(let i=0;i<id.data.length;i+=4)id.data[i+3]=id.data[i];cx.putImageData(id,0,0);
  const alphaOf=im=>{const c=document.createElement('canvas');c.width=D.w;c.height=D.h;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,D.w,D.h);for(let i=0;i<d.data.length;i+=4)d.data[i+3]=d.data[i];x.putImageData(d,0,0);return c};const wm=alphaOf(wv);
  msg.textContent='พร้อมแล้ว · ดูผิวน้ำกับใบบัว แล้วกด "เรียกปลามาเลย"';
  function frame(ms){const t=ms/1000;if(T0===null)T0=t;const tt=t-T0;frames++;if(t-lastFps>=1){fps=frames/(t-lastFps);frames=0;lastFps=t}
    if(tt>=nextFish){spawnFish(tt);if(!FAST&&Math.random()<0.25)setTimeout(()=>spawnFish((performance.now()/1000)-T0),700);nextFish=tt+fishDelay()}
    ctx.imageSmoothingEnabled=false;ctx.setTransform(Z,0,0,Z,0,0);ctx.drawImage(bg,0,0);
    if(OPT.wave){drawWave(tt,bg,wm);ctx.drawImage(waveLayer,0,0)}
    drawFish(tt,cm);ctx.drawImage(fishLayer,0,0);drawRings(tt);
    if(OPT.glint){for(const g of GL){const a=Math.max(0,Math.sin(tt*g.sp+g.ph))**3*0.75;if(a>0.02){ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';ctx.fillRect(Math.round(g.x+Math.sin(tt*0.3+g.ph)*2),Math.round(g.y),3,1)}}}
    for(const p of PADS){const [dx,dy]=padOffset(p,tt);ctx.drawImage(pads,p.sx,p.sy,p.w,p.h,Math.round((p.x+dx)*Z)/Z,Math.round((p.y+dy)*Z)/Z,p.w,p.h)}
    window.__dbg={t:tt,pad0:padOffset(PADS[0],tt),fish:FISH.map(f=>[f.x,f.y]),fps,next:nextFish};
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  document.getElementById('bFish').onclick=()=>{spawnFish((performance.now()/1000)-T0);msg.textContent='ปลามาแล้ว ดูเงาใต้น้ำ'};
  const tog=(id,k)=>{const b=document.getElementById(id);b.onclick=()=>{OPT[k]=!OPT[k];b.classList.toggle('on',OPT[k])}};tog('bPads','pads');tog('bGlint','glint');tog('bWave','wave');
  window.__api={OPT,rowShift,rings:RINGS,px:(x,y)=>Array.from(ctx.getImageData(Math.round(x*Z),Math.round(y*Z),1,1).data),spawnFish:()=>spawnFish((performance.now()/1000)-T0),fishDelay,clipAt:(x,y)=>{const d=cx.getImageData(Math.round(x),Math.round(y),1,1).data;return d[3]>0},PADS,padOffset}}
start();
