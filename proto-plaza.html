  let x0=o.sw,x1=0;for(let y=Math.max(0,cb-5);y<=cb;y++)for(let x=0;x<o.sw;x++)if(A(x,y)){x0=Math.min(x0,x);x1=Math.max(x1,x)}
  o.cb=cb;o.foot=Math.max(8,x1-x0+1);o.fx=(x0+x1)/2-o.sw/2;g.globalCompositeOperation='source-in';g.fillStyle='#0e1a10';g.fillRect(0,0,o.sw,o.sh);o.sil=c;o.a=1}
function silOf(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#0e1a10';g.fillRect(0,0,c.width,c.height);return c}
function softAO(c,x,y,w,a){const h=Math.max(3,w/3.4);c.save();c.translate(x,y);c.scale(1,h/w);const g=c.createRadialGradient(0,0,0,0,0,w/2);g.addColorStop(0,`rgba(10,20,26,${a})`);g.addColorStop(.6,`rgba(10,20,26,${a*.55})`);g.addColorStop(1,'rgba(10,20,26,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,w/2,0,7);c.fill();c.restore()}
// ---------- screen ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),vig=document.getElementById('vig');let VW=0,VH=0,SC=1;
function resize(){const dpr=devicePixelRatio||1,dw=Math.round(innerWidth*dpr),dh=Math.round(innerHeight*dpr);SC=Math.max(1,Math.round(dh/384));VW=Math.ceil(dw/SC);VH=Math.ceil(dh/SC);cv.width=VW*SC;cv.height=VH*SC;cv.style.width=(VW*SC/dpr)+'px';cv.style.height=(VH*SC/dpr)+'px'}
addEventListener('resize',resize);
// smooth shadow layer baked with the ground at screen resolution (Trickster style: behind, leaning right, soft)
let SHADOW=null,SHSC=0;function buildShadows(){const S=SC;SHSC=S;const Wp=MW*T*S,Hp=MH*T*S,m=document.createElement('canvas');m.width=Wp;m.height=Hp;const g=m.getContext('2d');g.imageSmoothingEnabled=true;const k=.55;
  for(const o of OBJ){if(!o.sil||o.flat)continue;const sh=o.cs||.45,h=o.cb+1,X=Math.round(o.x-o.sw/2),Y=Math.round(o.y);
    if(!o.small)for(let r=0;r<h;r+=2){g.globalAlpha=.3+.7*Math.pow(r/h,1.4);g.setTransform(S,0,-k*S,sh*S,S*(X+k*h),S*(Y-sh*h));g.drawImage(o.sil,0,r,o.sw,2,0,r,o.sw,2)}
    g.setTransform(S,0,0,S,0,0);g.globalAlpha=1;softAO(g,o.x+o.fx,o.y,o.foot*(o.small?1.1:1.25),o.small?.7:1)}
  const f=document.createElement('canvas');f.width=Wp;f.height=Hp;const q=f.getContext('2d');q.filter=`blur(${Math.round(2.5*S)}px)`;q.drawImage(m,0,0);q.filter='none';q.globalCompositeOperation='source-in';q.fillStyle='rgb(92,100,150)';q.fillRect(0,0,Wp,Hp);
  const gh=document.createElement('canvas');gh.width=Wp;gh.height=Hp;const hc=gh.getContext('2d');hc.imageSmoothingEnabled=false;hc.drawImage(ground,0,0,Wp,Hp);hc.globalCompositeOperation='multiply';hc.imageSmoothingEnabled=true;hc.drawImage(f,0,0);SHADOW=gh;
  const bl=sil=>{const c=document.createElement('canvas');c.width=sil.width*S;c.height=sil.height*S;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.filter=`blur(${Math.round(1.6*S)}px)`;x.drawImage(sil,0,0,c.width,c.height);return c};leah.shI=bl(leah.silI);leah.shW=bl(leah.silW)}
// ---------- minimap (top right, like RO) ----------
const mm=document.getElementById('mm'),mc=mm.getContext('2d'),MMS=3;let mmBase;
function makeMinimap(){mm.width=MW*MMS;mm.height=MH*MMS;mm.style.width=(MW*MMS)+'px';mm.style.height=(MH*MMS)+'px';mmBase=document.createElement('canvas');mmBase.width=mm.width;mmBase.height=mm.height;const g=mmBase.getContext('2d');
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const k=key(x,y);g.fillStyle=COBBLE.has(k)&&!WATER.has(k)?'#cfc2a8':CLIFF.has(k)?'#6b6384':WATER.has(k)&&PATH.has(k)?'#a0703a':WATER.has(k)?'#3aa7c2':PATH.has(k)?'#d8b879':'#4c8a3e';g.fillRect(x*MMS,y*MMS,MMS,MMS)}
  g.fillStyle='#8ff4ff';g.fillRect(PX*MMS-2,PY*MMS-2,4,4);for(const o of OBJ)if(o.sway){g.fillStyle='#24502a';g.fillRect(Math.floor(o.x/T)*MMS,Math.floor(o.y/T)*MMS,MMS,MMS)}
  if(ROCK){g.strokeStyle='#e0413b';g.lineWidth=1.5;const rx=Math.floor(ROCK.x/T)*MMS,ry=Math.floor(ROCK.y/T-1)*MMS;g.beginPath();g.moveTo(rx-3,ry-3);g.lineTo(rx+5,ry+5);g.moveTo(rx+5,ry-3);g.lineTo(rx-3,ry+5);g.stroke()}}
function drawMinimap(t){mc.drawImage(mmBase,0,0);for(const e of EXITS){mc.fillStyle='#8ff4ff';mc.fillRect(e.x/T*MMS-2,e.y/T*MMS-2,4,4)}
  mc.fillStyle=STONE.state?'#8ff4ff':'#9aa0a8';mc.fillRect(STONE.x/T*MMS-2,STONE.y/T*MMS-3,4,4);
  if(Math.floor(t*3)%2===0||leah.moving){const x=leah.x/T*MMS,y=leah.y/T*MMS,a=[0,Math.PI*.25,Math.PI*.5,Math.PI*.75,Math.PI,-Math.PI*.75,-Math.PI*.5,-Math.PI*.25][[2,1,0,7,6,5,4,3].indexOf(leah.row)]+Math.PI/2;
    mc.save();mc.translate(x,y);mc.rotate(a-Math.PI/2);mc.fillStyle='#fff';mc.strokeStyle='#1b1330';mc.lineWidth=1;mc.beginPath();mc.moveTo(5,0);mc.lineTo(-3,-3.5);mc.lineTo(-1.5,0);mc.lineTo(-3,3.5);mc.closePath();mc.fill();mc.stroke();mc.restore()}}
document.getElementById('mmw').onclick=()=>say('แตะแผนที่เล็ก = เปิดแผนที่โลก (ทำในเกมจริง)');
// ---------- ui ----------
const msgEl=document.getElementById('msg');let msgT=0;function say(s){msgEl.textContent=s;msgEl.style.opacity=1;msgT=3}
let L=.35,Lt=.35;document.getElementById('bL').onclick=e=>{Lt=Lt<.5?1:.35;e.target.textContent=Lt<.5?'🌙 แสงหรี่':'☀️ แสงกลับมา'};
setTimeout(()=>document.getElementById('card').style.opacity=0,2200);
let camX=0,camY=0;const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
cv.addEventListener('pointerdown',e=>{const dpr=devicePixelRatio||1;leah.tx=e.clientX*dpr/SC+camX;leah.ty=e.clientY*dpr/SC+camY});
const blocked=(x,y)=>x<6||y<6||x>MW*T-6||y>MH*T-4||SOLID.has(key(Math.floor(x/T),Math.floor(y/T)));
// ---------- effects ----------
const petals=Array.from({length:18},()=>({x:Math.random()*MW*T,y:Math.random()*MH*T,v:6+Math.random()*8,p:Math.random()*6}));
function ring(x,y,t,power){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<2;i++){ctx.strokeStyle=`rgba(150,240,255,${(.35+.45*power)*(i?.7:1)})`;ctx.lineWidth=i?1:1.5;ctx.setLineDash(i?[3,4]:[8,3]);ctx.lineDashOffset=(i?-1:1)*t*12;ctx.beginPath();ctx.ellipse(x,y,i?11:17,i?5:8,0,0,7);ctx.stroke()}
  ctx.setLineDash([]);const g=ctx.createRadialGradient(x,y,0,x,y,18);g.addColorStop(0,`rgba(140,235,255,${.18+.3*power})`);g.addColorStop(1,'rgba(140,235,255,0)');ctx.fillStyle=g;ctx.fillRect(x-18,y-18,36,36);
  for(let i=0;i<5;i++){const a=t*1.3+i*1.26,py=y-((t*14+i*7)%26);ctx.fillStyle='rgba(210,250,255,.8)';ctx.fillRect(Math.round(x+Math.cos(a)*10),Math.round(py),1,1)}ctx.restore()}
function label(x,y,s){ctx.save();ctx.font='bold 8px system-ui,sans-serif';const w=ctx.measureText(s).width+8;ctx.fillStyle='rgba(27,19,48,.85)';ctx.fillRect(Math.round(x-w/2),Math.round(y-9),Math.round(w),11);ctx.fillStyle='#a8793a';ctx.fillRect(Math.round(x-w/2),Math.round(y+2),Math.round(w),1);ctx.fillStyle='#fff3d6';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y-3);ctx.restore()}
function drawObj(o,t){const X=Math.round(o.x-o.sw/2-camX),Y=Math.round(o.y-(o.cb+1)-camY),im=(typeof FOUNT!=='undefined'&&o===FOUNT&&L<.6)?IMG.fold:IMG[o.img];ctx.globalAlpha=o.a;
  if(o.sway){const a=Math.sin(t*1.3+o.ph)*1.6;for(let r=0;r<o.sh;r+=4){const k=1-r/o.sh,dx=Math.round(a*k*k);ctx.drawImage(im,o.sx,o.sy+r,o.sw,4,X+dx,Y+r,o.sw,4)}}
  else ctx.drawImage(im,o.sx,o.sy,o.sw,o.sh,X,Y,o.sw,o.sh);ctx.globalAlpha=1}
let last=0,rockSaid=0;
function frame(now){requestAnimationFrame(frame);const t=now/1000,dt=Math.min(.05,(now-last)/1000||0);last=now;L+=(Lt-L)*Math.min(1,dt*1.5);
  if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.opacity=0}
  let mx=0,my=0;if(keys.ArrowLeft||keys.a)mx--;if(keys.ArrowRight||keys.d)mx++;if(keys.ArrowUp||keys.w)my--;if(keys.ArrowDown||keys.s)my++;
  if(mx||my)leah.tx=null;else if(leah.tx!==null){const dx=leah.tx-leah.x,dy=leah.ty-leah.y,d=Math.hypot(dx,dy);if(d<3)leah.tx=null;else{mx=dx/d;my=dy/d}}
  leah.moving=!!(mx||my);if(leah.moving){const n=Math.hypot(mx,my);mx/=n;my/=n;const sp=74*dt,nx=leah.x+mx*sp,ny=leah.y+my*sp;if(!blocked(nx,leah.y))leah.x=nx;if(!blocked(leah.x,ny))leah.y=ny;leah.dist+=sp;leah.row=[2,1,0,7,6,5,4,3][((Math.round(Math.atan2(my,mx)/(Math.PI/4))%8)+8)%8]}
  // interactions: exits, the Light Stone, the blocked pass
  for(const e of EXITS)if(Math.hypot(leah.x-e.x,leah.y-e.y)<11){say(e.msg);leah.tx=null;const dx=MW*T/2-e.x,dy=MH*T/2-e.y,dd=Math.hypot(dx,dy);leah.x+=dx/dd*24;leah.y+=dy/dd*24}
  if(!STONE.state&&Math.hypot(leah.x-STONE.x,leah.y-STONE.y-10)<30){STONE.state=1;STONE.t=t;say('✨ ศิลาแสงตื่นแล้ว · บันทึกจุดวาร์ป: ลานน้ำพุ')}
  
  camX=Math.round(Math.max(Math.min(leah.x-VW/2,MW*T-VW),0));camY=Math.round(Math.max(Math.min(leah.y-VH/2-10,MH*T-VH),0));
  if(!SHADOW||SHSC!==SC)buildShadows();
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#16301f';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(SHADOW,-camX*SC,-camY*SC);ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;
  // water shimmer
  let s=3;const r=()=>(s=(s*16807)%2147483647)/2147483647;WATER.forEach(k=>{const [x,y]=k.split(',').map(Number);for(let i=0;i<2;i++){const px=x*T+4+Math.floor(r()*24),py=y*T+((Math.floor(r()*32)+t*14)%32);if(Math.sin(t*3+px)>.2){ctx.fillStyle='rgba(235,255,255,.75)';ctx.fillRect(px-camX,Math.round(py-camY),2,1)}}});
  for(let i2=0;i2<8;i2++){const a2=t*2+i2,px=Math.round(FOUNT.x-camX+Math.cos(a2*1.7)*14),py=Math.round(FOUNT.y-96-camY-((t*20+i2*9)%26));ctx.fillStyle=i2%2?'#e8fbff':'#9fe8ff';ctx.fillRect(px,py,1+(i2%2),1+(i2%2))}
  ctx.drawImage(IMG.bridge,Math.round(bridgeX-64-camX),Math.round(12*T-64-camY));
  // warp circles and the Light Stone ring
  for(const e of EXITS){const near=Math.hypot(leah.x-e.x,leah.y-e.y)<80;ring(e.x-camX,e.y-camY,t,near?1:.5);if(near)label(e.x-camX,e.y-camY-26,e.name)}
  const sp=STONE.state?Math.min(1,(t-STONE.t)/1.2):0;ring(STONE.x-camX,STONE.y-camY+2,t*(STONE.state?1:.3),STONE.state?.4+.6*sp:.05);
  // fade tall things when Leah walks behind them
  for(const o of OBJ){let tg=1;if(o.tall&&leah.y<o.y-2){const X=o.x-o.sw/2,Y=o.y-(o.cb||o.sh);if(leah.x+12>X+8&&leah.x-12<X+o.sw-8&&leah.y>Y+6&&leah.y-50<o.y)tg=.42}o.a+=(tg-o.a)*Math.min(1,dt*10)}
  // Leah's soft shadow, then everything sorted by feet
  const lf=leah.moving?Math.floor(leah.dist/10)%6:0,lsx=leah.moving?lf*64:leah.row*64,lsy=leah.moving?leah.row*64:0;
  {const sh2=leah.moving?leah.shW:leah.shI,k=.55,shh=.5,h=61,X=Math.round(leah.x-32-camX),Y=Math.round(leah.y-camY);ctx.save();ctx.imageSmoothingEnabled=true;ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.55;softAO(ctx,leah.x-camX,leah.y-camY,24,1);
    ctx.globalAlpha=.4;ctx.setTransform(1,0,-k,shh,SC*(X+k*h),SC*(Y-shh*h));ctx.drawImage(sh2,lsx*SC,lsy*SC,64*SC,h*SC,0,0,64*SC,h*SC);ctx.restore()}
  const list=OBJ.concat([{leah:1,y:leah.y}]).sort((a,b)=>a.y-b.y);
  for(const o of list){if(o.leah){const im=leah.moving?IMG.lwalk:IMG.lidle;ctx.drawImage(im,lsx,lsy,64,64,Math.round(leah.x-32-camX),Math.round(leah.y-61-camY),64,64)}else drawObj(o,t)}
  // light stone pillar once awake
  if(STONE.state){ctx.save();ctx.globalCompositeOperation='lighter';const x=STONE.x-camX,y=STONE.y-camY-50,h=70*sp,g=ctx.createLinearGradient(0,y-h,0,y);g.addColorStop(0,'rgba(140,235,255,0)');g.addColorStop(1,`rgba(140,235,255,${.35*sp})`);ctx.fillStyle=g;ctx.fillRect(x-5,y-h,10,h);
    for(let i=0;i<6;i++){const py=y-((t*22+i*12)%70);ctx.fillStyle='rgba(220,252,255,.9)';ctx.fillRect(Math.round(x+Math.sin(t*2+i)*7),Math.round(py),1,1)}ctx.restore()}
  for(const p of petals){p.y+=p.v*dt;p.x+=Math.sin(t+p.p)*8*dt+4*dt;if(p.y>MH*T)p.y=-4;if(p.x>MW*T)p.x=0;ctx.fillStyle='#ffc6da';ctx.fillRect(Math.round(p.x-camX),Math.round(p.y-camY),2,1)}
  const k=1-L;if(k>.01){ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${Math.round(255-k*110)},${Math.round(255-k*85)},${Math.round(255-k*55)})`;ctx.fillRect(0,0,VW,VH)}
  ctx.globalCompositeOperation='lighter';const gl=(x,y,rr,col,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-rr,y-rr,rr*2,rr*2)};
  for(const o of OBJ)if(o.lamp)gl(o.x+22-camX,o.y-44-camY,16,'rgba(255,200,120,A)',.22+.4*k);gl(FOUNT.x-camX,FOUNT.y-104-camY,26,'rgba(120,230,255,A)',.25+.2*L+.08*Math.sin(t*2));
  ctx.globalCompositeOperation='source-over';vig.style.opacity=(1.25-.35*L).toFixed(2);drawMinimap(t)}
function start(){OBJ.forEach(measure);leah.silI=silOf(IMG.lidle);leah.silW=silOf(IMG.lwalk);makeGround();makeMinimap();resize();requestAnimationFrame(frame)}
