// --- walking: A* on the tile grid, then straighten the path where the line is clear ---
function walkable(m,tx,ty){return tx>=0&&ty>=0&&tx<m.w&&ty<m.h&&!m.SOLID.has(key(tx,ty))}
function findPath(m,sx,sy,gx,gy){let [ax,ay]=[Math.floor(sx/T),Math.floor(sy/T)],[bx,by]=[Math.floor(gx/T),Math.floor(gy/T)];

  while(open.length&&n++<6000){let bi=0;for(let i=1;i<open.length;i++)if(open[i][0]<open[bi][0])bi=i;const [,cur]=open.splice(bi,1)[0];if(cur===goal)break;const cx=cur%W,cy=(cur/W)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!walkable(m,nx,ny))continue;if(dx&&dy&&(!walkable(m,cx+dx,cy)||!walkable(m,cx,cy+dy)))continue;
      const ni=ny*W+nx,ng=g.get(cur)+(dx&&dy?1.414:1);if(ng<(g.has(ni)?g.get(ni):1e9)){g.set(ni,ng);came.set(ni,cur);open.push([ng+hh(ni),ni])}}}

2, 32], "wheelbarrow": [103, 137, 32, 32], "firewood": [137, 137, 32, 32]};
function newMap(id,kind,w,h,seed){return{id,kind,w,h,seed,PATH:new Set(),COBBLE:new Set(),WATER:new Set(),CLIFF:new Set(),FLOOR:new Set(),SOLID:new Set(),objs:[],decks:[],exits:[],stones:[],blocks:[],crystals:[],digs:[],spawns:[],glows:[],anims:[]}}
function addTree(m,k,tx,ty,solid=true){const src=MR[k]?['mprops',MR[k]]:['props',PR[k]];m.objs.push({img:src[0],sx:src[1][0],sy:src[1][1],sw:64,sh:64,x:tx*T+16,y:ty*T+30,sway:1,tall:1,cs:.5,ph:rnd()*6});if(solid)m.SOLID.add(key(tx,ty))}
function addProp(m,k,tx,ty,o={}){m.objs.push({img:'props',sx:PR[k][0],sy:PR[k][1],sw:64,sh:64,x:tx*T+16+(o.dx||0),y:ty*T+(o.dy??28),tall:o.tall??1,cs:o.cs??.45,lamp:k==='lamp'});if(o.solid!==0)m.SOLID.add(key(tx,ty))}
function addDeco(m,k,tx,ty,solid,dx=0){m.objs.push({img:'mprops',sx:MR[k][0],sy:MR[k][1],sw:64,sh:64,x:tx*T+16+dx,y:ty*T+28,cs:.3,tall:0,small:!solid});if(solid)m.SOLID.add(key(tx,ty))}

function addNpc(m,who,tx,ty,face=0){const o={img:'npc_'+who,sx:face*64,sy:0,sw:64,sh:64,x:tx*T+16,y:ty*T+28,tall:1,cs:.45,npc:who,face};m.objs.push(o);m.SOLID.add(key(tx,ty));(m.npcs||(m.npcs=[])).push(o)}

  const pr=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)m.COBBLE.add(key(x,y))};pr(17,0,18,8);pr(0,11,14,12);pr(22,11,35,12);pr(17,16,18,23);
  for(let y=-1;y<=m.h;y++){const c=28+Math.round(1.4*Math.sin(y*.33+1));m.WATER.add(key(c,y));m.WATER.add(key(c+1,y))}

   ['roundB',32,6],['roundA',33,9],['palm',32,14],['roundB',32,17],['roundA',31,21],['roundA',4,6],['roundB',3,16],['roundA',6,20],['banana',12,21],['roundB',23,21],['bananaB',26,16],['frangi',2,13]].forEach(a=>addTree(m,...a));
  const F={img:'fountBig',sx:0,sy:0,sw:128,sh:128,x:PX*T,y:(PY+1)*T+14,tall:1,cs:.35,pick:()=>(LIGHT<.6&&IMG.fountOld)||IMG.fountBig};m.objs.push(F);m.fountain=F;for(let x=16;x<=19;x++)for(let y=11;y<=12;y++)m.SOLID.add(key(x,y));
  addProp(m,'bench',15,8,{tall:0,cs:.3});addProp(m,'bench',20,8,{tall:0,cs:.3});addProp(m,'board',13,9);addProp(m,'stall',25,9);addProp(m,'bath',22,15,{tall:0,cs:.3});
  [[16,6],[19,6],[14,15],[21,15],[10,10],[16,18],[19,18]].forEach(([x,y])=>addProp(m,'lamp',x,y));
  addDeco(m,'flowers',12,14,0);addDeco(m,'flowers',23,9,0);addDeco(m,'flowers',15,17,0);addDeco(m,'flowers',21,17,0);addDeco(m,'bush',11,14,1);addDeco(m,'bush',24,8,1);addDeco(m,'grass',7,12,0);addDeco(m,'grass',27,20,0);
  addStone(m,'plaza',21,9,true);addNpc(m,'leah',16,15,0);addNpc(m,'nuan',26,10,0);addNpc(m,'mom',20,19,6);
  m.exits.push({id:'n',x:18*T,y:12,to:'mountain',toExit:'s',label:'mountain'},{id:'w',x:14,y:12*T,locked:1,label:'soonW'},{id:'e',x:m.w*T-14,y:12*T,locked:1,label:'soonE'},{id:'s',x:18*T,y:m.h*T-8,locked:1,label:'soonS'});
  m.spawnDefault=[18*T,7*T];return m}

function buildMountain(){SEED=23;const m=newMap('mountain','town',34,22,23);m.nameKey='mountain';
  const base=x=>(x>=14&&x<=20)?6:Math.max(4,Math.min(7,5+Math.round(1.2*Math.sin(x*.55)+.8*Math.sin(x*1.3))));
  for(let x=-1;x<=m.w;x++)for(let y=-1;y<=base(Math.max(0,Math.min(m.w-1,x)));y++)m.CLIFF.add(key(x,y));
  for(let x=3;x<=5;x++)for(let y=1;y<=base(x)+1;y++)m.CLIFF.delete(key(x,y));
  const pr=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)m.PATH.add(key(x,y))};
  pr(15,9,16,21);pr(14,8,19,9);pr(4,12,16,13);pr(17,12,33,13);for(let y=1;y<=12;y++)m.PATH.add(key(4,y));
  const sBase=Math.max(base(26),base(27),base(28),base(29));for(let y=sBase+1;y<m.h+1;y++){const c=27+Math.round(1.5*Math.sin(y*.35));m.WATER.add(key(c,y));m.WATER.add(key(c+1,y))}
  m.CLIFF.forEach(k=>m.SOLID.add(k));m.WATER.forEach(k=>m.SOLID.add(k));for(let x=3;x<=5;x++)for(let y=1;y<=base(x)+1;y++)m.SOLID.add(key(x,y));m.SOLID.add(key(15,7));m.SOLID.add(key(18,7));
  const br=[];for(const y of [12,13])for(let x=0;x<m.w;x++)if(m.WATER.has(key(x,y))){m.SOLID.delete(key(x,y));br.push(x)}
  m.decks.push({img:'bridgeRope',x:(Math.min(...br)+Math.max(...br)+1)/2*T,y:13*T,oy:61});
  [['pine',1,9],['pineTwin',2,11],['pine2',1,14],['pineThick',3,16],['pine',1,18],['pine2',6,19],['roundA',8,17],['pineYoung',10,20],['pineBird',8,8],['pine',11,9],
   ['pine',31,9],['pineThick',32,10],['pink',30,15],['pine2',32,18],['roundB',31,20],['frangi',22,11],['roundA',23,16],['pineYoung',20,19],['bananaB',24,9]].forEach(a=>addTree(m,...a));
  [['pine',1,2],['pine2',7,2],['pineThick',9,1],['pineTwin',11,2],['pine',13,1],['pine2',21,2],['pineYoung',23,1],['pine',25,2],['pineTwin',29,1],['pine2',31,2],['pine',33,3]].forEach(([k,x,y])=>addTree(m,k,x,y,false));
  addDeco(m,'bush',7,base(7)+1,1);addDeco(m,'fern',12,base(12)+1,0);addDeco(m,'boulder',10,10,1);addDeco(m,'flowers',8,15,0);addDeco(m,'flowers',24,18,0);addDeco(m,'grass',12,18,0);
  addDeco(m,'mossRock',25,10,0);addDeco(m,'stump',5,17,1);addDeco(m,'log',11,15,1);addDeco(m,'berry',29,17,1);
  addProp(m,'lamp',14,10);addProp(m,'lamp',19,10);
  addCave(m,'crate',13*T+16,8*T+28,{solid:1});addCave(m,'rope',12*T+14,8*T+24,{solid:1});
  m.objs.push({img:'caveDoor',sx:0,sy:0,sw:128,sh:128,x:17*T,y:7*T-10,flat:1});
  m.objs.push({img:'rock',sx:0,sy:0,sw:128,sh:128,x:4*T+16,y:(base(4)+2)*T+4,cs:.3});m.blocks.push({x:4*T+16,y:(base(4)+1)*T,msg:'rock'});
  addStone(m,'mountain',20,8);addNpc(m,'dad',13,11,2);
  m.exits.push({id:'s',x:16*T,y:m.h*T-6,to:'plaza',toExit:'n',label:'plaza'},{id:'e',x:m.w*T-14,y:13*T,locked:1,label:'soonE'},{id:'cave',x:17*T,y:7*T+20,to:'cave1',toExit:'up',label:'cave1'});
  const wf={x:(27+Math.round(1.5*Math.sin((sBase+1)*.35)))*T+6,top:(sBase-1)*T+6,bot:(sBase+1)*T+14,w:2*T-12};
  m.anims.push(tm=>{const x0=wf.x-camX,w=wf.w,top=wf.top-camY,bot=wf.bot-camY;ctx.fillStyle='rgba(120,215,235,.9)';ctx.fillRect(x0,top,w,bot-top);ctx.fillStyle='rgba(60,150,190,.9)';ctx.fillRect(x0,top,2,bot-top);ctx.fillRect(x0+w-2,top,2,bot-top);
    for(let i=0;i<14;i++){const xx=x0+3+((i*7)%(w-6)),len=6+(i%4)*3,yy=top+((tm*60+i*17)%(bot-top+len))-len;ctx.fillStyle=i%3?'rgba(235,252,255,.9)':'rgba(175,235,248,.95)';const y1=Math.max(top,Math.round(yy));ctx.fillRect(xx,y1,1,Math.max(0,Math.min(len,bot-y1)))}
    for(let i=0;i<16;i++){const a=tm*6+i*2.1,rx=Math.cos(a)*(8+(i%5)*2),ry=Math.abs(Math.sin(a*1.7))*5;ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(Math.round(x0+w/2+rx),Math.round(bot-ry),1+(i%2),1)}});
  m.glows.push([17*T-34,7*T-76],[17*T+34,7*T-76]);m.spawnDefault=[16*T,19*T];return m}

// ---------- Crystal Cave floors (rooms + corridors from a fixed seed, so saved crystals keep their ids) ----------
const CAVE_CFG={cave1:{seed:101,w:36,h:26,rooms:8,crystals:8,digs:5,mons:[['slime',4],['bat',2]],next:'cave2'},
  cave2:{seed:202,w:38,h:28,rooms:9,crystals:6,digs:5,mons:[['slime',4],['bat',3],['mushbug',3]],next:'cave3'},
  cave3:{seed:303,w:40,h:30,rooms:7,crystals:4,digs:4,mons:[['bat',3],['mushbug',3]],boss:true}};
function buildCave(id){const C=CAVE_CFG[id],m=newMap(id,'cave',C.w,C.h,C.seed);m.nameKey=id;const r=seeded(C.seed);SEED=C.seed;
  const rooms=[];let tries=0;
  if(C.boss)rooms.push({x:C.w-16,y:Math.floor(C.h/2)-6,w:13,h:11,boss:1});
  while(rooms.length<C.rooms&&tries++<400){const w=5+Math.floor(r()*5),h=4+Math.floor(r()*4),x=2+Math.floor(r()*(C.w-w-4)),y=2+Math.floor(r()*(C.h-h-4));
    if(rooms.some(o=>x<o.x+o.w+2&&x+w+2>o.x&&y<o.y+o.h+2&&y+h+2>o.y))continue;rooms.push({x,y,w,h})}
  const carve=(x,y)=>{if(x>0&&y>0&&x<C.w-1&&y<C.h-1)m.FLOOR.add(key(x,y))};
  rooms.forEach(o=>{for(let y=o.y;y<o.y+o.h;y++)for(let x=o.x;x<o.x+o.w;x++)carve(x,y)});
  const cen=o=>[Math.floor(o.x+o.w/2),Math.floor(o.y+o.h/2)];
  const order=[...rooms].sort((a,b)=>cen(a)[0]-cen(b)[0]);
  for(let i=1;i<order.length;i++){const [ax,ay]=cen(order[i-1]),[bx,by]=cen(order[i]);const hx=r()<.5;
    if(hx){for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++){carve(x,ay);carve(x,ay+1)}for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++){carve(bx,y);carve(bx+1,y)}}
    else{for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++){carve(ax,y);carve(ax+1,y)}for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++){carve(x,by);carve(x,by+1)}}}
  for(let y=0;y<C.h;y++)for(let x=0;x<C.w;x++)if(!m.FLOOR.has(key(x,y)))m.SOLID.add(key(x,y));
  const start=order[0],end=C.boss?rooms.find(o=>o.boss):order[order.length-1];m.rooms=rooms;
  const [sx,sy]=cen(start);m.exits.push({id:'up',x:sx*T+16,y:(start.y)*T+20,to:id==='cave1'?'mountain':'cave'+(+id.slice(4)-1),toExit:id==='cave1'?'cave':'down',label:id==='cave1'?'mountain':'up'});
  addCave(m,'ladder',sx*T+16,start.y*T+14,{flat:1});
  addStone(m,id,Math.min(start.x+start.w-1,sx+2),start.y+1);
  if(C.next){const [ex,ey]=cen(end);m.exits.push({id:'down',x:ex*T+16,y:ey*T+16,to:C.next,toExit:'up',label:'down'});addCave(m,'stairs',ex*T+16,ey*T+30,{flat:1})}
  const freeAny=()=>{for(let k=0;k<400;k++){const x=1+Math.floor(r()*(C.w-2)),y=1+Math.floor(r()*(C.h-2)),kk=key(x,y);if(m.SOLID.has(kk)||m.used?.has(kk))continue;if([...m.crystals,...m.digs].some(q=>Math.hypot(q.tx-x,q.ty-y)<2))continue;if(Math.hypot(x-sx,y-sy)<4)continue;(m.used||(m.used=new Set())).add(kk);return[x,y]}return null};
  // things to find: sleeping crystals and sparkling dig spots, spread out, never on the path between stairs
  const free=()=>{for(let k=0;k<600;k++){const o=rooms[Math.floor(r()*rooms.length)];if(o===start)continue;const x=o.x+1+Math.floor(r()*(o.w-2)),y=o.y+1+Math.floor(r()*(o.h-2)),kk=key(x,y);
    if(m.SOLID.has(kk)||m.used?.has(kk))continue;if([...m.crystals,...m.digs].some(q=>Math.hypot(q.tx-x,q.ty-y)<(m.digs.length||m.crystals.length<C.crystals?3:2.2)))continue;if(m.exits.some(e=>Math.hypot(e.x/T-x,e.y/T-y)<2.5))continue;(m.used||(m.used=new Set())).add(kk);return[x,y]}return null};
  for(let i=0;i<C.crystals;i++){const p=free();if(p)m.crystals.push({id:id+'-c'+i,tx:p[0],ty:p[1],x:p[0]*T+16,y:p[1]*T+22,awake:false})}
  for(let i=0;i<C.digs;i++){let p=free();if(!p)p=freeAny();if(p)m.digs.push({id:id+'-d'+i,tx:p[0],ty:p[1],x:p[0]*T+16,y:p[1]*T+18,done:false})}
  // decoration along the walls
  const deco=['stalag','mushY','mushR','pebbles','rocks','moss','amethyst','crate','cart','lantern','geode','boulder','pillar'];
  for(let i=0;i<rooms.length*4;i++){const o=rooms[Math.floor(r()*rooms.length)];if(o.boss&&r()<.6)continue;const edge=r()<.5,x=edge?(r()<.5?o.x:o.x+o.w-1):o.x+Math.floor(r()*o.w),y=edge?o.y+Math.floor(r()*o.h):(r()<.5?o.y:o.y+o.h-1),kk=key(x,y);
    if(m.SOLID.has(kk)||m.used.has(kk)||m.exits.some(e=>Math.hypot(e.x/T-x,e.y/T-y)<2.5))continue;const k=deco[Math.floor(r()*deco.length)],big=CR[k][2]>32;
    if(big&&(x===o.x||x===o.x+o.w-1||y===o.y||y===o.y+o.h-1)){addCave(m,k,x*T+16,y*T+30,{solid:1});m.used.add(kk)}else if(!big){addCave(m,k,x*T+16,y*T+26,{solid:k==='crate'||k==='cart'});m.used.add(kk);if(k==='lantern')m.glows.push([x*T+16,y*T+10])}}
  // monsters (placed away from the entrance)
  for(const [kind,n] of C.mons)for(let i=0;i<n;i++){for(let k=0;k<60;k++){const o=rooms[Math.floor(r()*rooms.length)];if(o===start)continue;const x=o.x+Math.floor(r()*o.w),y=o.y+Math.floor(r()*o.h);if(m.SOLID.has(key(x,y)))continue;m.spawns.push({kind,x:x*T+16,y:y*T+16});break}}
  if(id==='cave3')addNpc(m,'peb',sx+1,start.y+start.h-1,0);
  if(C.boss){const [bx,by]=cen(end);m.bossSpawn={x:bx*T+16,y:by*T+16};m.bossRoom=end}
  m.seen=new Set();m.spawnDefault=[sx*T+16,(start.y+1)*T+16];return m}
const MAPS={plaza:buildPlaza,mountain:buildMountain,cave1:()=>buildCave('cave1'),cave2:()=>buildCave('cave2'),cave3:()=>buildCave('cave3')};

function spawnMonsters(){MONS=[];DROPS=[];SHOTS=[];FX=[];TXT=[];if(M.kind!=='cave')return;const mul={cave1:1,cave2:1.6,cave3:2.3}[M.id];

  if(!isKid()&&!mo.boss)mo.st='chase';
  if(mo.hp<=0){sfx('kill');mo.happy=1;mo.gone=1.6;gainExp(mo.exp);drop(mo);if(mo.boss){S.boss=true;save();bossWin()}}}

function drop(mo){const r=Math.random(),n=Math.random();const f={cave1:1,cave2:2,cave3:3}[M.id]||1;
  if(mo.boss){DROPS.push({k:'item',item:mkItem(['sw','bow','staff','dag'][Math.floor(Math.random()*4)],3),x:mo.x,y:mo.y+8});DROPS.push({k:'coin',n:60,x:mo.x+14,y:mo.y+4});return}
  if(r<.65)DROPS.push({k:'coin',n:1+Math.floor(n*4*f),x:mo.x,y:mo.y});
  if(Math.random()<.18)DROPS.push({k:'potion',x:mo.x+8,y:mo.y+4});
  if(Math.random()<.1){const q=Math.random(),rar=q<.01?3:q<.08?2:q<.3?1:0;DROPS.push({k:'item',item:mkItem(['sw','bow','staff','dag'][Math.floor(Math.random()*4)],rar),x:mo.x-8,y:mo.y+2})}}

function pickQuestion(){const age=Math.max(6,Math.min(8,S.age>=12?8:S.age||7));let pool=QBANK.filter(q=>Math.abs(q.age-age)<=1&&!(LANG==='en'&&q.subject==='thai')&&q[LANG]);if(!pool.length)pool=QBANK.filter(q=>q[LANG]);
  let fresh=pool.filter(q=>!S.asked.includes(q.id));if(!fresh.length){S.asked=[];fresh=pool}const q=fresh[Math.floor(Math.random()*fresh.length)];S.asked.push(q.id);if(S.asked.length>300)S.asked.shift();return q}
function openQuiz(c){if(c.awake)return;const q=pickQuestion(),L=q[LANG]||q.th;let tries=0;PAUSE=true;
  const body=`<h2>${t('wake')}</h2><div class="qz">${L.q}</div><div class="ch">${L.choices.map((c2,i)=>`<button data-i="${i}">${c2}</button>`).join('')}</div><p class="note" id="qfb"></p>`;
  modal(body,false);document.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.disabled)return;
    if(i===q.answer){b.classList.add('ok');sfx('right');wakeCrystal(c,tries===0);setTimeout(()=>{closeModal();say(t('right'))},650)}
    else{tries++;sfx('wrong');b.classList.add('no');b.disabled=true;const fbEl=document.getElementById('qfb');
      if(tries>=2){document.querySelectorAll('.ch button')[q.answer].classList.add('ok');fbEl.textContent=t('answer')+' '+L.choices[q.answer]+(L.explain?' · '+L.explain:'');wakeCrystal(c,false);setTimeout(()=>{closeModal()},2600)}
      else fbEl.textContent=t('wrong')}})}
function wakeCrystal(c,full){c.awake=true;setTimeout(()=>sfx('wake'),300);setTimeout(()=>{const f=M.crystals||[];if(f.length&&f.every(x=>x.awake)){say(t('floorDone'));for(let i=0;i<50;i++)FX.push({k:'spark',x:P.x+(rnd()-.5)*80,y:P.y-30+(rnd()-.5)*50,vx:(rnd()-.5)*60,vy:-40-rnd()*50,t:0,life:1.3})}},900);(S.crystals[M.id]||(S.crystals[M.id]=[])).push(c.id);S.coins+=full?5:2;gainExp(full?10:5);setLight();for(let i=0;i<30;i++)FX.push({k:'spark',x:c.x,y:c.y-12,vx:(rnd()-.5)*70,vy:-30-rnd()*70,t:0,life:1});hud();save()}
const totalCrystals=()=>Object.values(S.crystals).reduce((a,b)=>a+b.length,0);
function setLight(){LIGHT=S.boss?1:Math.min(1,.35+.65*totalCrystals()/12)}
function doDig(d){d.done=true;sfx('dig');(S.digs[M.id]||(S.digs[M.id]=[])).push(d.id);P.atkAnim=.6;for(let i=0;i<14;i++)FX.push({k:'dirt',x:d.x,y:d.y,vx:(rnd()-.5)*60,vy:-40-rnd()*40,t:0,life:.7});
  const r=Math.random();setTimeout(()=>{if(r<.55)DROPS.push({k:'coin',n:3+Math.floor(Math.random()*8),x:d.x,y:d.y});else if(r<.8)DROPS.push({k:'gem',x:d.x,y:d.y});else if(r<.92)DROPS.push({k:'potion',x:d.x,y:d.y});else DROPS.push({k:'item',item:mkItem(['sw','bow','staff','dag'][Math.floor(Math.random()*4)],Math.random()<.3?1:0),x:d.x,y:d.y});say('⛏️ '+t('dig')+'!')},450);save()}

// ---- travel between maps ----
const fadeEl=document.getElementById('fade');function fadeTo(fn){fadeEl.style.opacity=1;setTimeout(()=>{fn();setTimeout(()=>fadeEl.style.opacity=0,80)},360)}
function getMap(id){if(!CACHE[id]){const m=MAPS[id]();m.objs.forEach(measure);buildGround(m);CACHE[id]=m}return CACHE[id]}
function goMap(id,exitId,atStone){const m=getMap(id);M=m;m.shadowSC=0;
  (m.crystals||[]).forEach(c=>c.awake=(S.crystals[id]||[]).includes(c.id));(m.digs||[]).forEach(d=>d.done=(S.digs[id]||[]).includes(d.id));m.stones.forEach(s=>s.awake=S.stones.includes(s.id));
  let p=m.spawnDefault;if(exitId){const e=m.exits.find(e=>e.id===exitId);if(e){const cx=m.w*T/2,cy=m.h*T/2,dx=cx-e.x,dy=cy-e.y,d=Math.hypot(dx,dy)||1;p=[e.x+dx/d*30,e.y+dy/d*30];if(m.kind==='cave')p=[e.x,e.y+34]}}
  if(atStone){const s=m.stones[0];if(s)p=[s.x,s.y+26]}
  if(blockedAt(m,p[0],p[1])){const q=findPath(m,m.spawnDefault[0],m.spawnDefault[1],p[0],p[1]);p=q?q[q.length-1]:m.spawnDefault}
  P.x=p[0];P.y=p[1];P.path=null;P.target=null;P.act=null;spawnMonsters();makeMinimap(m);showCard(t(m.nameKey),t('town'));setLight();hud();save()}
function useExit(e){if(e.locked){say(t('soon'));return}sfx('warp');fadeTo(()=>goMap(e.to,e.toExit))}

const $=id=>document.getElementById(id);
let msgT=0;function say(s){$('msg').textContent=s;$('msg').style.opacity=1;msgT=3}
function showCard(a,b){$('cardB').textContent=a;$('cardI').textContent=b;$('card').style.opacity=1;clearTimeout(showCard.t);showCard.t=setTimeout(()=>$('card').style.opacity=0,2000)}
function hud(){if(!S)return;const H=HOUSES[S.house];$('hRib').style.background=H.col;$('hName').textContent=S.name;$('hLv').textContent=' '+t('lv')+' '+S.lv;
  const kid=isKid();$('hpw').classList.toggle('hide',kid);if(!kid){$('hpI').style.width=(100*S.hp/hpMax())+'%';$('hpT').textContent=S.hp+'/'+hpMax()}
  $('xpI').style.width=(100*S.exp/needExp())+'%';$('xpT').textContent='EXP '+S.exp+'/'+needExp();$('hCry').textContent='✨ '+totalCrystals();$('hCoin').textContent='🪙 '+S.coins+(S.gems?'  💎 '+S.gems:'');
  $('bPot').classList.toggle('hide',kid);$('bCmp').classList.toggle('hide',!(M&&M.kind==='cave'));$('potN').textContent=S.potions;$('atkL').textContent=t('hit');$('mmn').textContent=M?t(M.nameKey):''}
function modal(html,closable=true){$('mBody').innerHTML=html+(closable?`<div style="text-align:right;margin-top:10px"><button id="mX">${t('close')}</button></div>`:'');$('modal').classList.remove('hide');PAUSE=true;if(closable)$('mX').onclick=closeModal}
function closeModal(){$('modal').classList.add('hide');PAUSE=false}
function wepIcon(it,px=2){const c=document.createElement('canvas');c.width=c.height=12*px;const g=c.getContext('2d'),col=RAR_COL[it.rar];g.fillStyle=col;g.globalAlpha=.25;g.fillRect(0,0,12*px,12*px);g.globalAlpha=1;
  const P2=(x,y,w,h,cl)=>{g.fillStyle=cl;g.fillRect(x*px,y*px,w*px,h*px)};
  if(it.type==='sw'){P2(7,1,2,7,'#c89a5a');P2(5,8,6,1,'#6b4a2a');P2(7,9,2,2,'#6b4a2a')}else if(it.type==='bow'){P2(3,1,1,10,'#8a5a2a');P2(4,1,2,1,'#8a5a2a');P2(4,10,2,1,'#8a5a2a');P2(6,1,1,10,'#eee');P2(5,5,5,1,'#ddd')}
  else if(it.type==='staff'){P2(6,3,1,8,'#7a4a2a');P2(5,1,3,2,'#c9a2ff')}else{P2(6,2,1,6,'#dfe6ee');P2(5,8,3,1,'#6b4a2a');P2(6,9,1,2,'#6b4a2a')}return c}
function openBag(){const it=S.inv.map((w,i)=>`<button class="it ${i===S.eq?'on':''}" data-i="${i}"><span data-c="${i}"></span><span><b class="r${w.rar}">${itemName(w)}</b><br>${t('atk')} ${w.atk}${w.spd>1?' · '+t('spd')+' ↑':''}<br><span class="note">${i===S.eq?t('equipped'):t('equip')}</span></span></button>`).join('');

  // fade tall things when the player walks behind them
  for(const o of M.objs){let tg=1;if(o.tall&&P.y<o.y-2){const X=o.x-o.sw/2,Y=o.y-(o.cb||o.sh);if(P.x+12>X+8&&P.x-12<X+o.sw-8&&P.y>Y+6&&P.y-50<o.y)tg=.42}o.a+=(tg-o.a)*.2}
  // player shadow
  const lf=P.moving?Math.floor(P.dist/10)%6:0,sx=P.moving?lf*64:P.row*64,sy=P.moving?P.row*64:0;
  {const sh=P.moving?PS.shW:PS.shS,X=Math.round(P.x-32-camX),Y=Math.round(P.y-camY);ctx.save();ctx.imageSmoothingEnabled=true;ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.55;softAO(ctx,P.x-camX,P.y-camY,24,1);
    if(sh){ctx.globalAlpha=M.kind==='cave'?.3:.4;ctx.setTransform(1,0,0,.5,SC*(X+.55*62),SC*(Y-.5*62));ctx.transform(1,0,-.55,1,0,0);ctx.drawImage(sh,sx*SC,sy*SC,64*SC,62*SC,0,0,64*SC,62*SC)}ctx.restore()}
  // y-sorted world
  const list=[];for(const o of M.objs)list.push([o.y,0,o]);for(const m of MONS)list.push([m.y,1,m]);for(const c of M.crystals||[])list.push([c.y,2,c]);for(const d of DROPS)list.push([d.y-2,3,d]);list.push([P.y,4,P]);list.sort((a,b)=>a[0]-b[0]);
  for(const [,k,o] of list){if(k===0)drawObj(o,tm);else if(k===1)drawMon(o,tm);else if(k===2)drawCrystal(o,tm);else if(k===3)drawDrop(o,tm);else drawPlayer(sx,sy)}
  for(const s of SHOTS){if(s.k==='bow'){ctx.save();ctx.translate(s.x-camX,s.y-camY);ctx.rotate(s.a||0);ctx.fillStyle='#fff6d0';ctx.fillRect(-6,-.5,9,1);ctx.fillStyle='#ffe36b';ctx.fillRect(3,-1,2,2);ctx.restore()}else if(s.k==='staff'){ctx.save();ctx.globalCompositeOperation='lighter';glow(s.x-camX,s.y-camY,9,'200,160,255',.9);ctx.restore();ctx.fillStyle='#fff';ctx.fillRect(Math.round(s.x-camX)-1,Math.round(s.y-camY)-1,2,2)}else{ctx.fillStyle='#6d6488';ctx.fillRect(Math.round(s.x-camX)-4,Math.round(s.y-camY)-4,8,8);ctx.fillStyle='#8f86a8';ctx.fillRect(Math.round(s.x-camX)-3,Math.round(s.y-camY)-4,5,4)}}
  for(const f of FX){const p=f.t/f.life,x=Math.round(f.x-camX),y=Math.round(f.y-camY);
    if(f.k==='slash'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(255,245,200,${1-p})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,10+p*6,f.a-1.1,f.a+1.1);ctx.stroke();ctx.restore()}
    else if(f.k==='boom'){ctx.save();ctx.globalCompositeOperation='lighter';glow(x,y,10+p*18,'200,160,255',.8*(1-p));ctx.restore()}
    else if(f.k==='bonk'){ctx.fillStyle=`rgba(255,120,120,${1-p})`;ctx.fillRect(x-1,y-4,2,8);ctx.fillRect(x-4,y-1,8,2)}
    else if(f.k==='dust'){ctx.fillStyle=`rgba(150,135,180,${.55*(1-p)})`;ctx.fillRect(x,y,2+Math.round(p*2),2+Math.round(p*2))}
    else if(f.k==='dirt'){ctx.fillStyle=`rgba(120,80,45,${1-p})`;ctx.fillRect(x,y,2,2)}
    else if(f.k==='spark'||f.k==='star'){ctx.fillStyle=f.k==='spark'?`rgba(170,245,255,${1-p})`:`rgba(255,236,150,${1-p})`;ctx.fillRect(x,y,1,1);if(p<.5){ctx.fillRect(x-1,y,3,1);ctx.fillRect(x,y-1,1,3)}}}
  // light: dim town until crystals wake it; caves are dark except near light
  const k=1-LIGHT;if(M.kind!=='cave'&&k>.01){ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${Math.round(255-k*110)},${Math.round(255-k*85)},${Math.round(255-k*55)})`;ctx.fillRect(0,0,VW,VH);ctx.globalCompositeOperation='source-over'}
  if(M.kind==='cave')drawDark(tm);
  ctx.globalCompositeOperation='lighter';
  for(const o of M.objs)if(o.lamp)glow(o.x+22-camX,o.y-44-camY,16,'255,200,120',.22+.4*k);
  for(const [x,y] of M.glows)glow(x-camX,y-camY,M.kind==='cave'?26:16,'255,190,110',M.kind==='cave'?.35:.22+.4*k);
  if(M.fountain)glow(M.fountain.x-camX,M.fountain.y-104-camY,26,'120,230,255',.25+.2*LIGHT+.08*Math.sin(tm*2));
  for(const c of M.crystals||[])if(c.awake)glow(c.x-camX,c.y-14-camY,22,'95,224,255',.35+.1*Math.sin(tm*3+c.x));
  for(const s of M.stones)if(S.stones.includes(s.id)){glow(s.x-camX,s.y-50-camY,18,'140,235,255',.3);ctx.fillStyle='rgba(140,235,255,.18)';ctx.fillRect(Math.round(s.x-camX)-4,Math.round(s.y-camY)-110,8,70)}
  ctx.globalCompositeOperation='source-over';
  // labels
  for(const e of M.exits)if(Math.hypot(P.x-e.x,P.y-e.y)<90)label(e.x-camX,e.y-camY-26,e.locked?t('soon').split(' (')[0]:t(e.label==='down'?'down':e.label==='up'?'up':e.label));
  for(const m of MONS)if(!m.happy&&m.hp<m.max){const w=m.boss?40:18,x=Math.round(m.x-camX-w/2),y=Math.round(m.y-camY-(m.h||22)-6);ctx.fillStyle='#120b22';ctx.fillRect(x-1,y-1,w+2,4);ctx.fillStyle='#b9a6ff';ctx.fillRect(x,y,Math.round(w*m.hp/m.max),2)}
  label(P.x-camX,P.y-camY-66,S.name,HOUSES[S.house].col);
  for(const x of TXT){ctx.save();ctx.font='bold 8px system-ui,sans-serif';ctx.textAlign='center';ctx.globalAlpha=1-x.t/1.1;ctx.fillStyle='#1b1330';ctx.fillText(x.s,x.x-camX+1,x.y-camY-x.t*18+1);ctx.fillStyle=x.c;ctx.fillText(x.s,x.x-camX,x.y-camY-x.t*18);ctx.restore()}
  if(M.boss&&M.boss.active&&!M.boss.happy){const w=Math.min(220,VW-120),x=Math.round(VW/2-w/2);label(VW/2,26,t('boss'),'#ff6b8a');ctx.fillStyle='#120b22';ctx.fillRect(x-1,30,w+2,6);ctx.fillStyle='#ff6b8a';ctx.fillRect(x,31,Math.round(w*M.boss.hp/M.boss.max),4)}
  if(tapMark){tapMark.t+=1/60;const p=tapMark.t/.45;if(p<1){ctx.strokeStyle=`rgba(255,246,210,${1-p})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(tapMark.x-camX,tapMark.y-camY,4+p*8,2+p*4,0,0,7);ctx.stroke()}else tapMark=null}
  if(P.hurt>0){ctx.fillStyle=`rgba(255,60,60,${P.hurt*.5})`;ctx.fillRect(0,0,VW,VH)}
  vig.style.opacity=M.kind==='cave'?1.3:(1.25-.35*LIGHT).toFixed(2);drawMinimap(tm)}
function drawPlayer(sx,sy){const im=P.moving?PS.walk:PS.stand;const a=DIR_ANG[P.row],l=P.atkAnim>0?Math.round(Math.sin(P.atkAnim/.25*Math.PI)*3):0;if(im)ctx.drawImage(im,sx,sy,64,64,Math.round(P.x-32-camX+Math.cos(a)*l),Math.round(P.y-62-camY+Math.sin(a)*l),64,64)
  if(compassT>0&&M.crystals){const c=M.crystals.filter(x=>!x.awake).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y))[0];if(c){const an=Math.atan2(c.y-P.y,c.x-P.x),r=28,x=P.x-camX+Math.cos(an)*r,y=P.y-26-camY+Math.sin(an)*r*.7;ctx.save();ctx.translate(x,y);ctx.rotate(an);ctx.fillStyle=`rgba(140,240,255,${Math.min(1,compassT)})`;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-4,-5);ctx.lineTo(-1,0);ctx.lineTo(-4,5);ctx.fill();ctx.restore()}}}
function drawMon(m,tm){const art=MON_ART[m.kind+(m.happy?1:0)];if(!art)return;const f=Math.floor(m.t*(m.fly?8:4))%2,im=art[f],w=im.width,h=im.height,X=Math.round(m.x-w/2-camX),Y=Math.round(m.y-h-camY-(m.fly?8+Math.sin(m.t*5)*2:0));
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.globalCompositeOperation='multiply';softAO(ctx,m.x-camX,m.y-camY,w*.8,.8);ctx.restore();
  ctx.globalAlpha=m.happy?Math.max(0,m.gone/1.6):1;ctx.drawImage(im,X,Y);if(m.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.6;ctx.drawImage(im,X,Y);ctx.globalCompositeOperation='source-over'}ctx.globalAlpha=1;
  if(m.happy&&m.gone>1.2){ctx.fillStyle='#ff8fbf';ctx.fillRect(Math.round(m.x-camX)-1,Y-6,3,2);ctx.fillRect(Math.round(m.x-camX)-2,Y-7,2,1);ctx.fillRect(Math.round(m.x-camX)+1,Y-7,2,1)}}
function drawCrystal(c,tm){const r=CR.crystal,X=Math.round(c.x-16-camX),Y=Math.round(c.y-30-camY);if(!IMG.cprops){ctx.fillStyle=c.awake?'#5fe0ff':'#6a7f8a';ctx.fillRect(X+12,Y+10,8,16);return}
  if(c.awake){ctx.drawImage(IMG.cprops,r[0],r[1],r[2],r[3],X,Y-Math.round(Math.sin(tm*2+c.x)*1.5),32,32)}
  else{ctx.globalAlpha=.55;ctx.drawImage(IMG.cprops,r[0],r[1],r[2],r[3],X,Y,32,32);ctx.globalAlpha=1;ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(120,110,140,.85)';ctx.fillRect(X+8,Y+6,16,24);ctx.globalCompositeOperation='source-over';
    if(Math.sin(tm*2.3+c.x)>.85){ctx.fillStyle='rgba(200,250,255,.9)';ctx.fillRect(X+17,Y+10,1,3);ctx.fillRect(X+16,Y+11,3,1)}}}
function drawDrop(d,tm){const x=Math.round(d.x-camX),y=Math.round(d.y-camY-3-Math.abs(Math.sin(tm*3+d.x))*2);
  if(d.k==='coin'){ctx.fillStyle='#7a5a10';ctx.fillRect(x-3,y-3,6,6);ctx.fillStyle='#ffd23f';ctx.fillRect(x-2,y-2,4,4);ctx.fillStyle='#fff3b0';ctx.fillRect(x-1,y-2,1,1)}
  else if(d.k==='potion'){ctx.fillStyle='#5a2a44';ctx.fillRect(x-3,y-5,6,8);ctx.fillStyle='#ff8fbf';ctx.fillRect(x-2,y-2,4,4);ctx.fillStyle='#ddd';ctx.fillRect(x-1,y-6,2,2)}
  else if(d.k==='gem'){ctx.fillStyle='#2a3a6a';ctx.fillRect(x-3,y-3,6,6);ctx.fillStyle='#9fd8ff';ctx.fillRect(x-2,y-2,4,3);ctx.fillStyle='#fff';ctx.fillRect(x-1,y-2,1,1)}
  else{ctx.save();ctx.globalCompositeOperation='lighter';glow(x,y-4,10,d.item.rar>=2?'255,210,90':d.item.rar?'120,170,255':'255,255,255',.5);ctx.restore();ctx.drawImage(wepIcon(d.item,1),x-6,y-10)}}
function drawDark(tm){if(!dark||dark.width!==VW||dark.height!==VH){dark=document.createElement('canvas');dark.width=VW;dark.height=VH;darkG=dark.getContext('2d')}const g=darkG;g.globalCompositeOperation='source-over';g.clearRect(0,0,VW,VH);g.fillStyle=S.boss?'rgba(8,5,18,.5)':'rgba(8,5,18,.84)';g.fillRect(0,0,VW,VH);g.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a=1)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${a})`);gr.addColorStop(.55,`rgba(0,0,0,${a*.8})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)};
  hole(P.x-camX,P.y-26-camY,132+Math.sin(tm*6)*2);for(const c of M.crystals)if(c.awake)hole(c.x-camX,c.y-14-camY,70,.9);for(const s of M.stones)hole(s.x-camX,s.y-30-camY,S.stones.includes(s.id)?70:34,.8);for(const [x,y] of M.glows)hole(x-camX,y-camY,50,.8);for(const e of M.exits)hole(e.x-camX,e.y-camY,34,.7);
  ctx.drawImage(dark,0,0)}

// ===== start =====
function loop(now){requestAnimationFrame(loop);const tm=now/1000,dt=Math.min(.05,(now-last)/1000||0);last=now;compassT=Math.max(0,compassT-dt);update(dt);render(tm)}
function startGame(){LANG=S.lang||LANG;SND=S.snd!==false;setTimeout(()=>{say(t('tipStart'));msgT=6},2300);buildPlayerSheets();['hud','topR','act'].forEach(i=>$(i).classList.remove('hide'));const id=MAPS[S.pos?.map]?S.pos.map:'plaza';goMap(id);if(S.pos&&S.pos.map===id&&!blockedAt(M,S.pos.x,S.pos.y)){P.x=S.pos.x;P.y=S.pos.y}
  showCard(t('welcome')+' '+S.name,t(M.nameKey));hud()}
async function boot(){resize();await loadImages();if(IMG.cave)IMG.caveCalm=calmCyan(IMG.cave);monArt();loadQuestions();S=Store.load();if(S&&S.v===1){LANG=S.lang||'th';startGame()}else{S=null;openCreator()}requestAnimationFrame(loop)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.GAME={get M(){return M},P,get S(){return S},get MONS(){return MONS},goMap,findPath,getMap,openQuiz,T};
boot();

</script></body></html>
