  const cell=(x,y)=>{if(!used.has(K(x,y)))used.set(K(x,y),{gx:x,gy:y,doors:new Set()});return used.get(K(x,y))};
  let cur=cell(0,sy);const path=[cur];let vmoves=0;
  while(cur.gx<gw-1||cur.gy!==ey){let nx=cur.gx,ny=cur.gy;
    if(cur.gx===gw-1)ny+=Math.sign(ey-cur.gy);

  const alive=MONS.filter(o=>!o.happy).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y));const tgt=(P.target&&!P.target.happy)?P.target:alive[0],pow=atkPow(),near=r=>alive.filter(o=>Math.hypot(o.x-P.x,o.y-P.y)<r);

const WHEEL=[['w_c20','#ffe36b',22],['w_pot','#ffb3d9',14],['w_c50','#9fd8ff',14],['w_treat','#a8f0a0',14],['w_seed','#ffc38a',14],['w_exp','#cdb6ff',12],['w_c100','#ffd23f',6],['w_card','#ff8fbf',4]];

function wheelPrize(k){const H=HOME.get();if(k==='w_c20')S.coins+=20;else if(k==='w_c50')S.coins+=50;else if(k==='w_c100')S.coins+=100;else if(k==='w_pot')S.potions+=2;else if(k==='w_treat')S.treats=(S.treats||0)+3;
  else if(k==='w_seed'){const c=Object.keys(CROPS)[Math.floor(Math.random()*5)];H.seeds[c]=(H.seeds[c]||0)+3;HOME.put(H)}else if(k==='w_exp')gainExp(50);else if(k==='w_card'){const c=CAVE1_SET[Math.floor(Math.random()*3)];pickUp({k:'card',mon:c,x:P.x,y:P.y})}}
function openWheel(){const W=S.wheel||{};const ok=canSpin(),yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  modal(`<h2>${t('wheel')}</h2><p class="note">${t('streak')} ${W.streak||0} ${t('days')} · 7 ${t('days')} = ${t('streak7')}</p><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px"><canvas id="wh" width="440" height="440" style="width:220px;height:220px"></canvas><div style="display:flex;flex-direction:column;gap:10px;max-width:260px"><button id="whGo" class="go" ${ok?'':'disabled'}>${ok?t('spin'):t('spun')}</button><p id="whRes" style="font-weight:800;min-height:1.2em;margin:0"></p></div></div>`);
  const cv2=$('wh'),g=cv2.getContext('2d'),tot=WHEEL.reduce((a,w)=>a+w[2],0);let ang=0;
  const draw=()=>{g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,220,220);let a0=ang-Math.PI/2;for(const [k,col,w] of WHEEL){const a1=a0+w/tot*Math.PI*2;g.beginPath();g.moveTo(110,110);g.arc(110,110,100,a0,a1);g.closePath();g.fillStyle=col;g.fill();g.strokeStyle='#1b1330';g.lineWidth=2;g.stroke();
      g.save();g.translate(110,110);g.rotate((a0+a1)/2);g.fillStyle='#1b1330';g.font='bold 10px system-ui';g.textAlign='right';g.fillText(t(k),92,4);g.restore();a0=a1}
    g.beginPath();g.arc(110,110,14,0,7);g.fillStyle='#fdf6e8';g.fill();g.stroke();g.fillStyle='#e0413b';g.beginPath();g.moveTo(110,4);g.lineTo(101,-8+4+14);g.lineTo(119,-8+4+14);g.closePath();g.fill()};draw();
  $('whGo').onclick=()=>{if(!canSpin())return;$('whGo').disabled=true;let r=Math.random()*tot,idx=0;for(let i=0;i<WHEEL.length;i++){if((r-=WHEEL[i][2])<=0){idx=i;break}}
    let before=0;for(let i=0;i<idx;i++)before+=WHEEL[i][2];const mid=(before+WHEEL[idx][2]/2)/tot*Math.PI*2,target=Math.PI*2*6-mid,start=performance.now(),dur=3200;let lastTick=0;
    const step=now=>{const p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3);ang=target*e;draw();const seg=Math.floor(ang/(Math.PI/8));if(seg!==lastTick){lastTick=seg;sfx('hit')}
      if(p<1)requestAnimationFrame(step);else{const k=WHEEL[idx][0];S.wheel={date:today(),streak:(W.date===yest?(W.streak||0)+1:1),best:0};S.wheel.best=Math.max(W.best||0,S.wheel.streak);wheelPrize(k);
        let extra='';if(S.wheel.streak%7===0){S.coins+=150;S.potions+=2;extra=' · 🎉 '+t('streak7')+' +150🪙';}{const wr=$('whRes');if(wr)wr.textContent='🎁 '+t('won')+' '+t(k)+extra;else say('🎁 '+t('won')+' '+t(k)+extra)}sfx('right');for(let i=0;i<30;i++)FX.push({k:'star',x:P.x,y:P.y-40,vx:(rnd()-.5)*120,vy:-60-rnd()*80,t:0,life:1.2});hud();save()}};requestAnimationFrame(step)}}
